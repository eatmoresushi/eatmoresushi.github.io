  - form "Take a Tech":
    - paragraph: Take up to 2 Techs from different disciplines, inspected or face up, each at its printed cost.
    - group "Inspected Firing Techs Tech 1 of up to 2":
      - text: ""
      - radio "Second Firing 2 Coins"
      - text: Second Firing 2 Coins Firing
      - strong: "Once per round, after Quality is assigned:"
      - text: choose 1 of your Flawed or Standard ceramics from this firing → reveal 2 extra Fire cards, choose 1; recalculate its Actual Heat and Quality with that card instead of the first (Jun's earlier adjustment is lost). The new Quality stands, even if worse.
      - radio "Protective Saggars 3 Coins"
      - text: Protective Saggars 3 Coins Firing
      - strong: "Always:"
      - text: your ceramics are never Flawed; a Heat Difference of 3 or more counts as Standard.
      - strong: "Once per round, after Quality is assigned:"
      - text: 1 of your Standard ceramics from this firing → Fine.
    - group "Or a face-up Tech":
      - text: ""
      - radio "Large Throwing Wheel 2 Coins"
      - text: Large Throwing Wheel 2 Coins Form & Decorate
      - strong: "Once per round, during a Form & Decorate action forming at least 1 Vase or Censer:"
      - text: reduce that action's total Clay cost by 2, minimum 0.
      - radio "Reworking Table 2 Coins"
      - text: Reworking Table 2 Coins Form & Decorate
      - strong: "Once per round, when you glaze and load a Shaped vessel:"
      - text: first change its Shape to any other Shape. Pay no Clay; its Decoration stays.
      - radio "Setter's Mark 2 Coins"
      - text: Setter's Mark 2 Coins Glazing & Loading
      - strong: "Once per round, at the start of the Work Phase:"
      - text: place this tile on an empty active Shared Kiln space → only you may load there this round.
      - radio "Colour Samples 2 Coins"
      - text: Colour Samples 2 Coins Glazing & Loading
      - strong: "When acquired:"
      - text: privately look at the top 3 cards of the Main Order deck → you must reserve 1; the rest go to the bottom of the deck.
      - strong: "Ongoing:"
      - text: your Order hand limit is 5.
      - strong: "Once per round, before or after one of your worker actions:"
      - text: discard 1 held Order → look at the top 2 cards, reserve 1.
      - radio "Fuel Ledger 2 Coins"
      - text: Fuel Ledger 2 Coins Firing
      - strong: "Always:"
      - text: your Bank and Stoke cost no Wood.
      - strong: "When you choose Bank or Stoke:"
      - text: secretly commit 1 Wood with it → Bank becomes −2, Stoke becomes +2.
      - radio "Test Pieces 3 Coins"
      - text: Test Pieces 3 Coins Firing
      - strong: "Once per round, after Base Heat, before Heat markers, if you have a ceramic in this firing:"
      - text: pay 1 Wood → privately look at the top Fire card; you may put it on the bottom of the deck.
    - paragraph: Choose a Tech to take.
    - button "Clear"
    - button "Confirm" [disabled]