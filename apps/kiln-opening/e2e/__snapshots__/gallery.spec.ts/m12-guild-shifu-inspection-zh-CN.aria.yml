- complementary "你的决断":
  - paragraph: 派工阶段·轮到你了
  - heading "习得技艺" [level=2]
  - region "Zhao（你）":
    - heading "Zhao（你）" [level=3]
    - group "资源":
      - strong: "0"
      - text: 泥
      - strong: "2"
      - text: 柴
      - strong: "3"
      - text: 铜钱
    - img "你的学徒"
    - img "你的学徒"
    - img "你的学徒"
    - text: 手中4张委托 声望0／4 5分
  - form "习得技艺":
    - paragraph: 从不同门类中习得至多2项技艺，所看的或公开的都可以，各按牌面价付费。
    - group "所看釉作技艺 第1项（至多2项）":
      - text: ""
      - radio "色样簿 2铜钱"
      - text: 色样簿 2铜钱 釉作
      - strong: 习得时：
      - text: 精选3。
      - strong: 持续：
      - text: 你的委托上限为5张。
      - strong: 每轮一次，你的一次工人行动之前或之后：
      - text: 可弃1张在手委托→精选3。
      - radio "漕船 2铜钱"
      - text: 漕船 2铜钱 釉作
      - strong: 每轮一次，完成委托时：
      - text: 得2铜钱。
    - group "或取公开技艺":
      - text: ""
      - radio "高徒 3铜钱"
      - text: 高徒 3铜钱 坯作
      - strong: 每轮一次：
      - text: 你派往泥柴场或瓷牙行的1名学徒可改按师傅效果结算。
      - radio "大陶车 2铜钱"
      - text: 大陶车 2铜钱 坯作
      - strong: 每轮一次，制坯饰纹行动中制有至少1件瓶或香炉时：
      - text: 该行动的泥总费−2，最低为0。
      - radio "支烧窑具 2铜钱"
      - text: 支烧窑具 2铜钱 釉作
      - strong: 每轮一次，将1件器物装入共窑时：
      - text: 可将本牌垫于其下→本次烧成中，该器物的温区修正由你定为−1、0或+1。
      - radio "窑位签 2铜钱"
      - text: 窑位签 2铜钱 釉作
      - strong: 每轮一次，派工阶段开始时：
      - text: 可将本牌置于共窑1个空的启用窑位→本轮只有你能在此装窑。
      - radio "柴簿 2铜钱"
      - text: 柴簿 2铜钱 火作
      - strong: 持续：
      - text: 你的压火与添柴不付柴。
      - strong: 习得时：
      - text: 获取柴簿压火与柴簿添柴两张控火牌（付1柴→−2或+2）。
      - radio "火照 3铜钱"
      - text: 火照 3铜钱 火作
      - strong: 每轮一次，基础火候定后、翻火标前，本窑有己方器物时：
      - text: 可付1柴→私看窑火牌堆顶1张，可将其置于牌堆底。
    - paragraph: 请选择要习得的技艺。
    - button "取消"
    - button "确认" [disabled]