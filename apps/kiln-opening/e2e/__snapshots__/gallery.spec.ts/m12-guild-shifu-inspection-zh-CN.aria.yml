- complementary "你的决断":
  - paragraph: 派工阶段·轮到你了
  - heading "习得技艺" [level=2]
  - region "Wen（你）":
    - heading "Wen（你）" [level=3]
    - group "资源":
      - strong: "1"
      - text: 泥
      - strong: "2"
      - text: 柴
      - strong: "9"
      - text: 铜钱
    - img "你的学徒"
    - img "你的学徒"
    - img "你的学徒"
    - text: 手中4张委托 声望0／4 4分
  - form "习得技艺":
    - paragraph: 从不同门类中习得至多2项技艺，所看的或公开的都可以，各按牌面价付费。
    - group "所看坯作技艺 第1项（至多2项）":
      - text: ""
      - radio "改坯案 2铜钱"
      - text: 改坯案 2铜钱 坯作
      - strong: 每轮一次，为1件坯施釉装窑时：
      - text: 可先将其器型改为任意其他器型。不付泥，纹饰不变。
      - radio "高徒 3铜钱"
      - text: 高徒 3铜钱 坯作
      - strong: 每轮一次：
      - text: 你派往泥柴场或瓷牙行的1名学徒可改按师傅效果结算。
    - group "或取公开技艺":
      - text: ""
      - radio "大陶车 2铜钱"
      - text: 大陶车 2铜钱 坯作
      - strong: 每轮一次，制坯饰纹行动中制有至少1件瓶或香炉时：
      - text: 该行动的泥总费−2，最低为0。
      - radio "清玩斋 3铜钱"
      - text: 清玩斋 3铜钱 坯作
      - strong: 终局时：
      - text: 你陈列中的每件上品或臻品+1分，至多+5分。
      - radio "支烧窑具 2铜钱"
      - text: 支烧窑具 2铜钱 釉作
      - strong: 每轮一次，将1件器物装入共窑时：
      - text: 可将本牌垫于其下→本次烧成中，该器物的温区修正由你定为−1、0或+1。
      - radio "覆烧 2铜钱"
      - text: 覆烧 2铜钱 釉作
      - strong: 每轮一次，将1件碗、盘或笔洗装入共窑时：
      - text: 可放入恰有1件己方器物的启用窑位；两件同用该窑位的修正。
      - radio "匣钵护烧 3铜钱"
      - text: 匣钵护烧 3铜钱 火作
      - strong: 持续：
      - text: 你的器物永不为瑕品，火候差3或以上算作良品。
      - strong: 每轮一次，定品后：
      - text: 己方本窑1件良品→上品。
      - radio "火照 3铜钱"
      - text: 火照 3铜钱 火作
      - strong: 每轮一次，基础火候定后、翻窑火前，本窑有己方器物时：
      - text: 可付1柴→私看窑火牌堆顶1张，可将其置于牌堆底。
    - paragraph: 请选择要习得的技艺。
    - button "取消"
    - button "确认" [disabled]