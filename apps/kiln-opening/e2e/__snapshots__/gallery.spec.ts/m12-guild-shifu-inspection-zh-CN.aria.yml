- complementary "你的决断":
  - paragraph: 派工阶段·轮到你了
  - heading "习得技艺" [level=2]
  - region "Lin（你）":
    - heading "Lin（你）" [level=3]
    - group "资源":
      - strong: "0"
      - text: 泥
      - strong: "2"
      - text: 柴
      - strong: "4"
      - text: 铜钱
    - img "你的学徒"
    - img "你的学徒"
    - img "你的学徒"
    - text: 手中4张委托 声望0／4 0分
  - form "习得技艺":
    - paragraph: 从不同门类中习得至多2项技艺，所看的或公开的都可以，各按牌面价付费。
    - group "所看火作技艺 第1项（至多2项）":
      - text: ""
      - radio "复烧 2铜钱"
      - text: 复烧 2铜钱 火作
      - strong: 每轮一次，定品后：
      - text: 可选己方本窑1件瑕品或良品→另翻2张窑火牌，选1张代替原牌，重算其实际火候与品质（钧窑的调整不保留）；新品质即使更差也算。
      - radio "匣钵护烧 3铜钱"
      - text: 匣钵护烧 3铜钱 火作
      - strong: 持续：
      - text: 你的器物永不为瑕品，火候差3或以上算作良品。
      - strong: 每轮一次，定品后：
      - text: 己方本窑1件良品→上品。
    - group "或取公开技艺":
      - text: ""
      - radio "大陶车 2铜钱"
      - text: 大陶车 2铜钱 坯作
      - strong: 每轮一次，制坯饰纹行动中制有至少1件瓶或香炉时：
      - text: 该行动的泥总费−2，最低为0。
      - radio "改坯案 2铜钱"
      - text: 改坯案 2铜钱 坯作
      - strong: 每轮一次，为1件坯施釉装窑时：
      - text: 可先将其器型改为任意其他器型。不付泥，纹饰不变。
      - radio "窑位签 2铜钱"
      - text: 窑位签 2铜钱 釉作
      - strong: 每轮一次，派工阶段开始时：
      - text: 可将本牌置于共窑1个空的启用窑位→本轮只有你能在此装窑。
      - radio "色样簿 2铜钱"
      - text: 色样簿 2铜钱 釉作
      - strong: 习得时：
      - text: 私看主委托牌堆顶3张→须承接1张，其余放到牌堆底。
      - strong: 持续：
      - text: 你的委托上限为5张。
      - strong: 每轮一次，你的一次工人行动之前或之后：
      - text: 可弃1张在手委托→看牌堆顶2张，承接1张。
      - radio "柴簿 2铜钱"
      - text: 柴簿 2铜钱 火作
      - strong: 持续：
      - text: 你的压火与添柴不付柴。
      - strong: 选控火时：
      - text: 若选压火或添柴，可随控火牌暗附1柴→控火修正改为压火−2或添柴+2。
      - radio "火照 3铜钱"
      - text: 火照 3铜钱 火作
      - strong: 每轮一次，基础火候定后、翻火标前，本窑有己方器物时：
      - text: 可付1柴→私看窑火牌堆顶1张，可将其置于牌堆底。
    - paragraph: 请选择要习得的技艺。
    - button "取消"
    - button "确认" [disabled]