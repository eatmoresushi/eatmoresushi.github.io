- complementary "你的决断":
  - paragraph: 派工阶段·轮到你了
  - heading "派工" [level=2]
  - region "Player 1（你）":
    - heading "Player 1（你）" [level=3]
    - group "资源":
      - strong: "9"
      - text: 泥
      - strong: "9"
      - text: 柴
      - strong: "9"
      - text: 铜钱
    - img "你的师傅"
    - img "你的学徒"
    - img "你的学徒"
    - img "你的学徒"
    - text: 手中0张委托 声望1／4 0分
