    - paragraph: 你还有4名工人未派（共4名）。派工阶段不能跳过。
    - region "派师傅到施釉装窑":
      - heading "派师傅到施釉装窑" [level=3]
      - text: 你的第1工位
      - paragraph: 至多2件坯施釉装窑（仍是1柴）
