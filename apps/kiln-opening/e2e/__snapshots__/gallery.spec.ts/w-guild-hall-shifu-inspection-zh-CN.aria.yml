  - form "习得技艺":
    - paragraph: 从不同门类中习得至多2项技艺，所看的或公开的都可以，各按牌面价付费。
    - group "所看火作技艺 第1项（至多2项）":
      - text: ""
      - radio "火照 3铜钱"
      - text: 火照 3铜钱 火作
      - strong: 每轮一次，基础火候定后、翻窑火前，本窑有己方器物时：
      - text: 可付1柴→私看窑火牌堆顶1张，可将其置于牌堆底。
      - radio "复烧 2铜钱"
      - text: 复烧 2铜钱 火作
      - strong: 每轮一次，定品后：
      - text: 己方本窑1件瑕品或良品→另翻2张窑火牌，以其中1张重算其品质，即使更差也算。
    - group "或取公开技艺":
      - text: ""
      - radio "饰坯匣 2铜钱" [disabled]
      - text: 饰坯匣 2铜钱 坯作
      - strong: 每轮一次：
      - text: 你制的1件坯少付1铜钱。可与师傅的减免叠加。
      - paragraph: 你已拥有一项坯作技艺
      - radio "改坯案 2铜钱" [disabled]
      - text: 改坯案 2铜钱 坯作
      - strong: 每轮一次，为1件坯施釉装窑时：
      - text: 可先将其器型改为任意其他器型。不付泥，纹饰不变。
      - paragraph: 你已拥有一项坯作技艺
      - radio "色样簿 3铜钱"
      - text: 色样簿 3铜钱 釉作
      - strong: 习得时：
      - text: 精选3。
      - strong: 持续：
      - text: 你的委托上限为5张。
      - strong: 每轮一次，你的一次工人行动之前或之后：
      - text: 可弃1张在手委托→精选3。
      - radio "看火 3铜钱"
      - text: 看火 3铜钱 釉作
      - strong: 每轮一次，至少装窑1件的施釉装窑行动之后：
      - text: 得1泥1柴。
      - radio "匣钵护烧 2铜钱"
      - text: 匣钵护烧 2铜钱 火作
      - strong: 持续：
      - text: 你的器物永不为瑕品，火候差3或以上算作良品。
      - strong: 每轮一次，定品后：
      - text: 己方本窑1件良品→上品。
      - radio "柴簿 4铜钱"
      - text: 柴簿 4铜钱 火作
      - strong: 持续：
      - text: 你的压火与添柴不付柴。
      - strong: 习得时：
      - text: 获取柴簿压火与柴簿添柴两张控火牌（付1柴→−2或+2）。
    - paragraph: 请选择要习得的技艺。
    - button "取消"
    - button "确认" [disabled]