- complementary "你的决断":
  - paragraph: 派工阶段·轮到你了
  - heading "再习得一项技艺，或不再习得" [level=2]
  - region "Lin（你）":
    - heading "Lin（你）" [level=3]
    - group "资源":
      - strong: "0"
      - text: 泥
      - strong: "1"
      - text: 柴
      - strong: "4"
      - text: 铜钱
    - img "你的学徒"
    - img "你的学徒"
    - img "你的学徒"
    - text: 手中4张委托 声望0／4 7分
  - form "再习得一项技艺，或不再习得":
    - paragraph: 本次已习得：饰坯匣
    - group "所看坯作技艺 第2项（至多2项）":
      - text: ""
      - radio "大陶车 2铜钱" [disabled]
      - text: 大陶车 2铜钱 坯作
      - strong: 每轮一次，制坯饰纹行动中制有至少1件瓶或香炉时：
      - text: 该行动的泥总费−2，最低为0。
      - paragraph: 你已拥有一项坯作技艺
      - radio "改坯案 2铜钱" [disabled]
      - text: 改坯案 2铜钱 坯作
      - strong: 每轮一次，为1件坯施釉装窑时：
      - text: 可先将其器型改为任意其他器型。不付泥，纹饰不变。
      - paragraph: 你已拥有一项坯作技艺
    - group "或取公开技艺":
      - text: ""
      - radio "高徒 3铜钱" [disabled]
      - text: 高徒 3铜钱 坯作
      - strong: 每轮一次：
      - text: 你派往泥柴场或瓷牙行的1名学徒可改按师傅效果结算。
      - paragraph: 你已拥有一项坯作技艺
      - radio "窑位签 2铜钱" [disabled]
      - text: 窑位签 2铜钱 釉作
      - strong: 每轮一次，派工阶段开始时：
      - text: 可将本牌置于共窑1个空的启用窑位→本轮只有你能在此装窑。
      - paragraph: 你已拥有一项釉作技艺
      - radio "支烧窑具 2铜钱" [disabled]
      - text: 支烧窑具 2铜钱 釉作
      - strong: 每轮一次，将1件器物装入共窑时：
      - text: 可将本牌垫于其下→本次烧成中，该器物的温区修正由你定为−1、0或+1。
      - paragraph: 你已拥有一项釉作技艺
      - radio "窑工 2铜钱"
      - text: 窑工 2铜钱 火作
      - strong: 每轮一次，装窑1件器物时：
      - text: 可在它上面放一个+1或−1标记。其数值计入该器物的实际火候。
      - radio "复烧 2铜钱"
      - text: 复烧 2铜钱 火作
      - strong: 每轮一次，定品后：
      - text: 己方本窑1件瑕品或良品→另翻2张窑火牌，以其中1张重算其品质，即使更差也算。
    - paragraph: 再习得的技艺必须是另一门类，按牌面价付费。被取走的技艺位空着，直到你的回合结束。
    - group "或者就此停下":
      - text: ""
      - radio "不再习得 没有习得的所看技艺放回牌堆底，顺序由你决定。"
      - text: 不再习得 没有习得的所看技艺放回牌堆底，顺序由你决定。
    - paragraph: 请再选一项要习得的技艺，或不再习得。
    - button "取消"
    - button "确认" [disabled]