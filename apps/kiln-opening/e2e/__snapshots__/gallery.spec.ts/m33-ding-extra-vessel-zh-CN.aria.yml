      - text: 你的第1工位
      - paragraph: 制1件坯：泥费+2铜钱，纹饰任选
      - group "制坯饰纹":
        - group "器型":
          - text: ""
          - radio "碗 1泥 + 2铜钱" [checked]
          - text: 碗 1泥 + 2铜钱
          - radio "盘 1泥 + 2铜钱"
          - text: 盘 1泥 + 2铜钱
          - radio "笔洗 1泥 + 2铜钱"
          - text: 笔洗 1泥 + 2铜钱
          - radio "瓶 2泥 + 2铜钱"
          - text: 瓶 2泥 + 2铜钱
          - radio "香炉 2泥 + 2铜钱"
          - text: 香炉 2泥 + 2铜钱
        - group "纹饰":
          - text: ""
          - paragraph: 纹饰任选，不另计费。每件坯付器型泥费外加所示铜钱。
          - radio "素面" [checked]
          - text: 素面
          - radio "刻花"
          - text: 刻花
          - radio "印花"
          - text: 印花
          - radio "画花"
          - text: 画花
        - checkbox "范制成器：再制同型坯" [checked]
        - text: 范制成器：再制同型坯
        - button "完整规则：定窑 · 范制成器"
        - group "额外坯的纹饰":
          - text: ""
          - radio "素面" [checked]
          - text: 素面
          - radio "刻花"
          - text: 刻花
          - radio "印花"
          - text: 印花
          - radio "画花"
          - text: 画花
        - group "费用": 碗 1泥 碗（制坯） 2铜钱 「范制成器」：碗 1泥2铜钱 共付 2泥4铜钱
        - group "行动后你的资源": 行动后 泥2 → 0 柴3 → 3 铜钱7 → 3
      - paragraph: 要改派别处，在桌面上另点一个派工按钮。
    - paragraph:
      - text: 派
      - strong: 学徒
      - text: 到
      - strong: 制坯饰纹
      - text: ：碗 · 素面，另用范制成器制碗 · 素面
    - button "派工并结束回合"
