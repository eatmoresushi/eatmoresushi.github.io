    - group "哥窑 · 金丝铁线":
      - button "哥窑 · 金丝铁线"
      - paragraph:
        - strong: 每轮一次，定品后：
        - text: 可令己方本窑1件良品开片→升为上品。
        - strong: 完成委托时：
        - text: 每件开片器可作任意1种纹饰；永远不算臻品。
      - radio "灰青釉香炉 · 印花 · 良品"
      - text: 灰青釉香炉 · 印花 · 良品
