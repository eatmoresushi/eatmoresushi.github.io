.cer{position:relative;display:inline-block;width:var(--s,36px);height:var(--s,36px);flex:none;border-radius:50%;background:var(--porcelain);box-shadow:0 0 0 2px var(--pc,var(--line));overflow:visible}
.cer .spr{position:absolute;inset:8%;background:var(--img) center/contain no-repeat;background-color:transparent}
.cer .spr::after{content:"";position:absolute;inset:0;background:var(--g,#ddd);-webkit-mask:var(--img) center/contain no-repeat;mask:var(--img) center/contain no-repeat;mix-blend-mode:multiply}
.cer .spr:not([class*="s-"]),.cer.nosprite .spr{background:repeating-linear-gradient(45deg,#ddd 0 4px,#eee 4px 8px);border-radius:50%}
.cer .badge{position:absolute;right:-5px;bottom:-5px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;background:var(--pc,#666);color:#fff;font:700 12px/17px var(--sans);text-align:center}
.cer.focus{box-shadow:0 0 0 2px var(--pc),0 0 0 5px var(--gold)}
.cer.ghost{opacity:.35;box-shadow:0 0 0 2px var(--pc) inset}
.cer.preview{box-shadow:0 0 0 2px var(--pc);outline:2px dashed var(--ink-soft);outline-offset:3px}

/* ---------- app frame ---------- */
.app{display:grid;height:100vh;grid-template-columns:minmax(0,1fr) var(--rcol);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "left right" "dock right"}
.topbar{grid-area:top;display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--teal);color:#f3efe4;min-width:0;white-space:nowrap}
.topbar>*{flex:none}
.topbar .order{flex:0 1 auto;overflow:hidden}
.topbar .k{color:#c9d8d0}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--serif);font-size:17px}
.brand span{font-size:12px;color:#c9d8d0}
.roundbox{display:flex;align-items:baseline;gap:4px}
.roundbox b{font-size:18px}
.phaserail{display:flex;gap:2px;margin:0;padding:0;list-style:none}
.phaserail li{padding:3px 9px;border-radius:999px;font-size:12px;color:#c9d8d0;border:1px solid transparent;white-space:nowrap}
.phaserail li.on{background:#f3efe4;color:var(--teal);font-weight:700}
.phaserail li.done{color:#9fb6ad}
.die{display:flex;align-items:center;gap:6px}
.pip{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;background:#f3efe4;color:var(--ink);font-weight:800;font-size:16px;box-shadow:inset 0 -2px 0 #cbbf9f}
.order{display:flex;align-items:center;gap:4px;min-width:0}
.order .arr{color:#9fb6ad}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center}
.ctl select,.ctl button{font-size:12px;border-radius:999px;border:1px solid #6f948b;background:#24524e;color:#f3efe4;padding:5px 10px;cursor:pointer}
.ctl button b{color:#fff}
.pchip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:999px;background:rgb(255 255 255 / 12%);font-size:12px;white-space:nowrap}
.pchip i{width:16px;height:16px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 2px #f3efe4;display:inline-grid;place-items:center;font:700 12px/1 var(--sans);font-style:normal;color:#fff}
.pchip.fp::after{content:attr(data-fp);font-size:12px;color:var(--gold-pale);margin-left:2px}
.pchip.me{background:rgb(255 255 255 / 22%);font-weight:700}

.left{grid-area:left;overflow:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.right{grid-area:right;overflow:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line);background:linear-gradient(#efe8da,#efe8da) ;min-width:0}
.dock{grid-area:dock;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"dec" "mat";border-top:2px solid var(--teal);background:#ece3d2;box-shadow:0 -8px 24px rgb(41 34 26 / 10%);min-width:0}
/* during firing the Shared Kiln compacts so the docked Firing Stage fits beside it */
.firing .ks{min-height:58px;padding:4px}
.firing .ks .cer{--s:32px !important}
.firing .gl{height:84px}

.panel{background:var(--porcelain);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.panel>header{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.panel>header .zh{font-family:var(--serif);color:var(--ink-soft);font-size:13px}
.panel>header .aside{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--paper);white-space:nowrap}
.tag.ready{border-color:#9db9a8;background:var(--celadon-pale);color:var(--celadon-dark)}
.tag.used{color:var(--ink-soft);text-decoration:line-through}
.tag.priv{border-color:var(--gold);background:var(--gold-pale);color:#6e4f17}
.tag.fp{background:var(--gold-pale);border-color:var(--gold)}
.tag.bad{border-color:#d9a79e;background:#f7e2dc;color:#7a2d24}
.tag.ok{border-color:#9db9a8;background:var(--celadon-pale);color:var(--celadon-dark)}

/* ---------- opponents ---------- */
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.opp{border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:var(--r);background:var(--porcelain);padding:6px 10px;display:grid;gap:3px;min-width:0}
.opp header{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.opp header b{font-size:14px}
.opp .vp{margin-left:auto;font-weight:700}
.opp .row{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:12px}
.res{display:inline-flex;gap:8px;font-size:12px}
.res span{display:inline-flex;align-items:center;gap:3px}
.res span::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.res.big{font-size:13px;gap:8px;flex-wrap:wrap}
.res.big b{font-size:15px}
.hid{display:inline-flex;align-items:center;gap:3px}
.cardback{display:inline-block;width:10px;height:14px;border-radius:2px;background:var(--teal-2);box-shadow:2px -2px 0 -0.5px #8fb0a6}
.tp{display:inline-flex;gap:3px;align-items:center}
.tp i{font-style:normal;font-size:12px;padding:0 6px;border-radius:4px;color:#fff;background:var(--dc)}

/* ---------- central board ---------- */
.central{container-type:inline-size}
.locs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@container (min-width:520px){.locs{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container (min-width:820px){.locs{grid-template-columns:repeat(5,minmax(0,1fr))}}
.loc{position:relative;border:1px solid var(--line);border-radius:var(--r);padding:8px;background:linear-gradient(180deg,#fbf7ee,#f4ecdd);display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;cursor:default}
.loc h3{display:flex;flex-direction:column}
.loc h3 small{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink-soft)}
.loc.legal{border-color:var(--teal-2);box-shadow:0 0 0 2px rgb(43 95 90 / 25%);cursor:pointer;background:linear-gradient(180deg,#fdfbf5,#eef3ec)}
.loc.legal:hover{box-shadow:0 0 0 3px rgb(43 95 90 / 45%)}
.loc.sel{box-shadow:0 0 0 3px var(--gold)}
.loc.illegal{opacity:.78}
.slots{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.slot{width:22px;height:22px;border-radius:50%;border:1.5px dashed #b4a88f;display:inline-grid;place-items:center;font:700 12px/1 var(--sans);color:#fff}
.slot.occ{border:2px solid #fff;background:var(--pc);box-shadow:0 0 0 1px var(--pc)}
.slot.shifu{border-radius:6px}
.slot.next{border-color:var(--teal-2);border-style:solid}
.eff{display:grid;gap:3px;font-size:12px;line-height:1.35}
.eff p{margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.eff p b{display:inline-block;min-width:16px;text-align:center;border-radius:4px;background:var(--paper-deep);margin-right:4px;font-size:12px}
.eff p.s b{background:var(--teal);color:#fff}
.loc .status{font-size:12px;display:grid;gap:3px;justify-items:start}
.quote{font-size:12px;padding:3px 6px;border-radius:6px;background:var(--paper);border:1px solid var(--line-soft)}
.quote.bad{background:#f7e2dc;border-color:#e1b4aa}

/* ---------- markets ---------- */
.band{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px}
.ordersrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.ocard{border:1px solid var(--line);border-radius:8px;background:#fffdf7;padding:6px 7px;display:flex;flex-direction:column;gap:4px;min-height:132px;min-width:0}
.ocard.crown{border-color:#d7b878;background:linear-gradient(#fffaf0,#fbf3df)}
.ocard header{display:flex;align-items:center;gap:4px}
.ocard header b{font-size:12px;letter-spacing:.02em}
.ocard header .crowns{margin-left:auto;display:inline-flex;gap:1px}
.ocard .req{font-size:12px;line-height:1.3;flex:1;white-space:pre-line}
.ocard .mq{font-size:12px;color:var(--ink-soft)}
.ocard footer{display:flex;gap:6px;font-size:12px;font-weight:700;align-items:baseline}
.ocard footer .vpv{font-size:15px;color:var(--teal)}
.ocard.empty{border-style:dashed;background:transparent;display:grid;place-items:center;text-align:center;color:var(--ink-soft);font-size:12px}
.ocard.start{background:#f6f8f1;border-color:#c4cfb5}
.deckrow{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink-soft);margin-top:6px;flex-wrap:wrap}
.crownico{width:13px;height:13px;color:var(--gold)}
.techs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.techcol{display:flex;flex-direction:column;gap:5px;min-width:0}
.techcol>.k{display:flex;justify-content:space-between;border-bottom:2px solid var(--dc);padding-bottom:2px}
.tech{border:1px solid var(--line);border-top:3px solid var(--dc);border-radius:6px;background:#fffdf7;padding:5px 6px;min-width:0}
.tech header{display:flex;gap:4px;align-items:baseline}
.tech header b{font-size:12px;line-height:1.2}
.tech header .cost{margin-left:auto;font-size:12px;font-weight:700;color:#7a5a20;white-space:nowrap}
.tech p{margin:3px 0 0;font-size:12px;line-height:1.3;white-space:pre-line;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.recog{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.rstep{border:1px solid var(--line);border-radius:6px;padding:5px;background:#fbf6ea;display:flex;flex-direction:column;gap:3px;min-width:0}
.rstep .n{font:700 15px/1 var(--serif);color:#7a5a20}
.rstep b{font-size:12px;line-height:1.2}
.rstep p{margin:0;font-size:12px;line-height:1.25;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rstep .mk{display:flex;gap:3px;min-height:16px}
.rstep .mk i{width:16px;height:16px;border-radius:50%;background:var(--pc);color:#fff;font:700 12px/16px var(--sans);text-align:center;font-style:normal}
.rstep.gate{background:repeating-linear-gradient(135deg,#fbf6ea 0 8px,#f5edda 8px 16px)}

/* ---------- shared kiln ---------- */
.kiln{display:grid;gap:6px}
.zone{display:grid;grid-template-columns:62px repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.zone>.zl{display:flex;flex-direction:column;justify-content:center;border-radius:8px;padding:4px 6px;color:#fff;font-size:12px;line-height:1.2}
.zone>.zl b{font-size:14px}
.zone.high>.zl{background:#9a4a30}.zone.middle>.zl{background:#8a6a3c}.zone.low>.zl{background:#4f6d6a}
.ks{border:1px solid var(--line);border-radius:8px;background:#fffaf0;padding:5px;min-height:76px;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.ks .sh{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft)}
.ks.cov{background:repeating-linear-gradient(135deg,#e9e1d1 0 6px,#e2d8c5 6px 12px);border-style:dashed;color:var(--ink-soft);display:grid;place-items:center;text-align:center;font-size:12px}
.ks.target{border:2px dashed var(--teal-2);background:#eef4ef}
.ks .pc{display:flex;align-items:center;gap:6px;min-width:0}
.ks .pc .t{font-size:12px;line-height:1.25;min-width:0}
.hm{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:50%;font:800 12px/1 var(--sans);background:#f7efe0;border:2px solid var(--pc,#333);color:var(--ink)}
.hm.down{background:#2c2b28;color:#e9e1cf}
.hm.km{border-radius:5px}
.furn{font-size:12px;padding:1px 6px;border-radius:4px;background:#d9cbb0;color:#4b3b22;align-self:flex-start}
.imps{display:grid;gap:6px;margin-top:8px}
.imp{display:flex;align-items:center;gap:8px;border:1px solid #d7b878;border-radius:8px;background:linear-gradient(90deg,#fbf3df,#fffaf0);padding:6px 8px;font-size:12px}
.imp b{font-family:var(--serif);font-size:13px}
.modchip{display:inline-flex;gap:2px}
.modchip span{padding:0 6px;border-radius:4px;border:1px solid #d7b878;font-weight:700;font-size:12px}
.modchip span.on{background:var(--gold);color:#fff;border-color:var(--gold)}

/* ---------- firing stage ---------- */
.stage.active{border-color:var(--d-firing);box-shadow:0 0 0 2px rgb(165 72 46 / 18%)}
.gl{position:relative;height:118px;border-radius:8px;overflow:hidden;background:
  radial-gradient(120px 80px at 50% 120%, rgb(165 72 46 / 45%), transparent 70%),
  repeating-linear-gradient(135deg,#ddd3c0 0 10px,#d6cbb6 10px 20px);display:grid;grid-template-columns:repeat(4,1fr);align-items:end;gap:6px;padding:8px}
.gl .tagline{position:absolute;top:6px;left:8px;font-size:12px;color:#5d5444;background:rgb(255 253 248 / 75%);padding:1px 6px;border-radius:4px}
.ro{background:rgb(255 253 248 / 92%);border-radius:6px;padding:4px 6px;text-align:center;font-size:12px;line-height:1.2;border:1px solid var(--line)}
.ro b{display:block;font:700 20px/1.1 var(--serif)}
.ro.fire b{color:var(--d-firing)}
.ro.face-down b{color:var(--ink-soft)}
.steps{display:flex;gap:3px;margin:8px 0 4px;padding:0;list-style:none}
.steps li{flex:1;height:22px;border-radius:4px;background:var(--paper-deep);display:grid;place-items:center;font-size:12px;color:var(--ink-soft)}
.steps li.done{background:#d9c7b6;color:#6b4b3a}
.steps li.on{background:var(--d-firing);color:#fff;font-weight:700}
.stepname{display:flex;gap:8px;align-items:baseline;font-size:12px;flex-wrap:wrap}
.stepname b{font-size:14px;font-family:var(--serif)}
.contribs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.contrib{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px 2px 3px;border-radius:999px;border:1px solid var(--line);background:#fffaf0}
.contrib i{width:16px;height:16px;border-radius:50%;background:var(--pc);font:700 12px/16px var(--sans);font-style:normal;color:#fff;text-align:center}
.ladder{display:grid;gap:2px;margin-top:6px;font-size:12px}
.lrow{display:grid;grid-template-columns:86px var(--cols);gap:2px;align-items:stretch}
.lrow>.lh{display:flex;flex-direction:column;justify-content:center;line-height:1.15;padding-right:4px}
.lrow>.lh small{color:var(--ink-soft);font-size:12px}
.cell{min-height:38px;border-radius:4px;display:flex;flex-wrap:wrap;gap:3px;align-items:center;justify-content:center;padding:3px 0;position:relative}
.cell.q-masterpiece{background:var(--q-masterpiece)}
.cell.q-fine{background:var(--q-fine)}
.cell.q-standard{background:var(--q-standard)}
.cell.q-flawed{background:repeating-linear-gradient(135deg,var(--q-flawed) 0 5px,#f7e5e0 5px 10px)}
.cell.pref{box-shadow:inset 0 0 0 2px #b0893c}
.cell.gutter{background:#e4dccd;border:1px dashed #b9ac94}
.axis .cell{min-height:20px;font-weight:700;background:transparent}
.axis .cell.glob{background:var(--d-firing);color:#fff}
.axis .cell.base{background:#e3c3b6}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;margin-top:6px;color:var(--ink-soft)}
.legend span{display:inline-flex;gap:4px;align-items:center}
.legend span i{width:12px;height:12px;border-radius:3px;background:var(--qc)}
.ledger{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.ledger th,.ledger td{padding:3px 4px;border-bottom:1px solid var(--line-soft);text-align:center;white-space:nowrap}
.ledger th{font-weight:600;color:var(--ink-soft)}
.ledger td:first-child,.ledger th:first-child{text-align:left}
.ledger td.q{font-weight:700}
.ledger tr.me td{background:#f7f1e3}
.ledger tr.focus td{background:var(--gold-pale)}
.qb{display:inline-block;padding:0 5px;border-radius:4px;background:var(--qc)}
.firefoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px}
.fcard{display:inline-grid;place-items:center;width:26px;height:34px;border-radius:4px;border:1px solid #c9b79a;background:#fff8ec;font-weight:800;font-size:12px}
.fcard.hot{color:var(--d-firing)} .fcard.cool{color:#38607a}
.tablewrap{overflow-x:auto}

/* ---------- decision bar ---------- */
.decision{grid-area:dec;display:flex;align-items:center;gap:12px;padding:8px 14px;background:#f7f1e3;border-bottom:1px solid var(--line);min-height:54px;flex-wrap:wrap}
.decision.act{background:var(--teal);color:#f3efe4}
.decision.act .k{color:#c9d8d0}
.decision .who{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.decision .who b{font-family:var(--serif);font-size:16px}
.decision .acts{display:flex;gap:6px;flex-wrap:nowrap;margin-left:auto;flex:none}
.decision .prompt{flex:1 1 200px;min-width:0}
.decision .who{flex:none}
.wchips{flex-wrap:nowrap}
.decision .hint{flex:1 1 120px;min-width:0}
.impslot{flex-wrap:wrap;row-gap:2px}
@media (min-width:760px){.decision{flex-wrap:nowrap}}
@media (max-width:1500px){.brand span{display:none}}
.btn{border:1px solid var(--line);background:var(--porcelain);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;line-height:1.2;display:inline-flex;flex-direction:column;align-items:flex-start}
.btn small{font-weight:400;font-size:12px;opacity:.85}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1d160a}
.btn.ghost{background:transparent;border-color:#6f948b;color:inherit}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wchips{display:flex;gap:6px;flex-wrap:wrap}
.wchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px 4px 4px;border:1px solid #6f948b;background:transparent;color:inherit;cursor:pointer;font-size:13px}
.wchip i{width:20px;height:20px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 2px #f3efe4;display:inline-grid;place-items:center;font:700 12px/1 var(--sans);font-style:normal;color:#fff}
.wchip.shifu i{border-radius:5px}
.wchip.on{background:#f3efe4;color:var(--teal);font-weight:700}

/* ---------- player mat ---------- */
.mat{grid-area:mat;display:grid;grid-template-columns:210px minmax(240px,270px) minmax(0,1fr) 200px;grid-template-rows:auto auto;grid-template-areas:"id fd ws tech" "id gl ws imp";gap:6px 8px;padding:8px 12px;min-width:0;max-height:190px;background:linear-gradient(180deg,#efe6d4,#e9dfcb);border-left:6px solid var(--pc)}
.mat>section{background:rgb(255 253 248 / 80%);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0;overflow:hidden}
.mat .ws{overflow:auto}
.mat .ws .wsrow{flex-wrap:nowrap}
.mat .trad p{-webkit-line-clamp:2}
.mat .sid{grid-area:id;display:flex;flex-direction:column;gap:5px}
.mat .sid .nm{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.mat .sid .nm b{font-family:var(--serif);font-size:16px}
.trad{font-size:12px;line-height:1.3;border-top:1px solid var(--line-soft);padding-top:4px}
.trad b{font-family:var(--serif);font-size:13px}
.trad p{margin:2px 0 0;white-space:pre-line;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}
.pl .lt{min-width:0}
.pl .lt b{font-size:13px;font-family:var(--serif);display:block}
.pl .lt .small{display:block;color:var(--ink-soft);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psp{width:52px;height:48px;border-radius:8px;border:1.5px dashed #a99c82;display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.1;color:var(--ink-soft);background:#fffaf0}
.psp.lock{border-style:solid;border-color:#9b7b52;background:repeating-linear-gradient(135deg,#e8d8bc 0 6px,#e0ceaf 6px 12px);color:#5b4325}
.psp.lock::before{content:attr(data-lock);display:block;font-weight:700;color:#7a2d24}
.psp.occ{border-style:solid;background:#fff;border-color:var(--pc)}
.psp.legal{border-color:var(--teal-2);border-style:solid;box-shadow:0 0 0 2px rgb(43 95 90 / 25%);cursor:pointer}
.psp .slot{width:26px;height:26px}
.ws{grid-area:ws;display:flex;flex-direction:column;gap:3px}
.wsgroups{display:flex;gap:12px;align-items:flex-start}
.wsgroups>div{display:flex;flex-direction:column;gap:3px}
.wsrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.wsitem{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:1.15;text-align:center;max-width:70px}
.techslots{grid-area:tech;display:grid;gap:3px}
.tslot{display:flex;align-items:center;gap:6px;font-size:12px;border-left:3px solid var(--dc);padding:2px 6px;background:#fffaf0;border-radius:0 4px 4px 0;min-height:22px}
.tslot.empty{color:var(--ink-soft);background:transparent;border-left-style:dashed}
.tslot b{font-size:12px}
.tslot .tag{margin-left:auto}
.impslot{grid-area:imp;display:flex;align-items:center;gap:8px;font-size:12px;border-color:#d7b878 !important;background:linear-gradient(90deg,#fbf3df,#fffaf0) !important}
.impslot.locked{background:repeating-linear-gradient(135deg,#f3ecdc 0 7px,#eee5d2 7px 14px) !important;color:var(--ink-soft)}
.hand{border-color:#d7b878;background:linear-gradient(#fffaf0,#f8efda)}
.handrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.handrow .ocard{min-height:118px}
.techstat{margin-top:4px}

/* ---------- phone tabs ---------- */
.tabbar{display:none}
.mobile-only{display:none}

/* ---------- mid widths ---------- */
@media (max-width:1180px) and (min-width:760px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "left" "right" "dock"}
  .left,.right{overflow:visible}
  .right{border-left:0}
  .dock{position:sticky;bottom:0}
  .band{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1366px) and (min-width:1181px){
  .mat{grid-template-columns:190px 236px minmax(0,1fr) 180px}
  .brand span{display:none}
}

/* ---------- phone ---------- */
@media (max-width:759px){
  body{padding-bottom:calc(var(--decH,96px) + 60px)}
  .app{display:flex;flex-direction:column;height:auto;min-height:100vh}
  .left,.right,.dock{display:contents}
  .topbar{position:sticky;top:0;z-index:5;flex-wrap:wrap;gap:4px 8px;padding:6px 12px}
  .brand,.order,.phaserail li:not(.on),.die .k{display:none}
  .ctl{gap:4px;margin-left:auto}
  .ctl select{max-width:118px;padding:4px 6px}
  .ctl button{padding:4px 8px}
  [data-tab]{margin:0 12px 12px}
  body:not([data-tab="table"]) [data-tab="table"],
  body:not([data-tab="kiln"]) [data-tab="kiln"],
  body:not([data-tab="workshop"]) [data-tab="workshop"],
  body:not([data-tab="orders"]) [data-tab="orders"]{display:none !important}
  .tabhead{display:block;margin:12px 12px 8px;font:600 18px/1.2 var(--serif)}
  .mobile-only{display:block}
  .decision{position:fixed;left:0;right:0;bottom:60px;z-index:6;border-top:2px solid var(--gold);padding:6px 12px 8px;gap:4px 8px;min-height:0}
  .decision .who{flex-direction:row;gap:8px;align-items:baseline;width:100%}
  .decision .who b{font-size:15px;order:-1}
  .decision .prompt,.decision .hint,.decision>.cer{display:none}
  .decision .acts{margin-left:0;width:100%;flex-wrap:nowrap}
  .decision .acts .btn{flex:1 1 0;padding:6px 8px;min-width:0}
  .decision .acts .btn small{display:none}
  .wchip{padding:2px 8px 2px 2px;font-size:12px}
  .ledger .bd{display:none}
  .firing .sec-stage{order:0}.firing .sec-shared{order:1}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;height:60px;z-index:7;background:var(--porcelain);border-top:1px solid var(--line)}
  .tabbar button{border:0;background:transparent;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;cursor:pointer;color:var(--ink-soft)}
  .tabbar button.on{color:var(--teal);font-weight:700;box-shadow:inset 0 3px 0 var(--teal)}
  .tabbar button .dot{position:absolute;top:8px;right:calc(50% - 26px);width:9px;height:9px;border-radius:50%;background:var(--gold)}
  .tabbar svg{width:20px;height:20px}
  .ordersrow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .handrow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .techs{grid-template-columns:minmax(0,1fr)}
  .techcol{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .techcol>.k{grid-column:1/-1}
  .recog{grid-template-columns:repeat(5,minmax(0,1fr))}
  .rstep p{display:none}
  .band{display:contents}
  .mat{display:flex;flex-direction:column;border-left:0;border-top:6px solid var(--pc);border-radius:var(--r);max-height:none}
  .mat .ws .wsrow{flex-wrap:wrap}.wsgroups{flex-wrap:wrap}
  .hand{order:-1}
  .sec-orders{order:0}

const tr = (o) => o == null ? '' : typeof o === 'string' ? o : (o[state.lang] ?? o.en ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const signed = (n) => n == null ? '—' : n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0';

const DCOL = { workshop: 'var(--d-workshop)', glazing_loading: 'var(--d-glazing)', firing: 'var(--d-firing)' };
const QCOL = { masterpiece: 'var(--q-masterpiece)', fine: 'var(--q-fine)', standard: 'var(--q-standard)', flawed: 'var(--q-flawed)' };
const STEP_OF = { firing_contributions: 1, firing_test_pieces: 4, firing_heat_markers: 5, firing_heat_adjustment: 8, firing_second_firing_jun: 10, firing_after_quality: 10, firing_salvage: 11 };
const PHASE_OF = (t) => t === 'work_turn' || t === 'round_start_setters_mark' ? 'work' : t.startsWith('firing') ? 'firing' : t === 'orders' ? 'orders' : t.startsWith('cleanup') ? 'cleanup' : 'start';
const crownSvg = '<svg class="crownico" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M1 5l3.5 3L8 2l3.5 6L15 5l-1.6 8H2.6z"/></svg>';

let M, G, S, V, PS, ORDER;
function load() {
  M = D.moments[MI[state.m]]; G = M.game; S = M.sel; V = M.viewerId;
  PS = Object.fromEntries(S.playerSummaries.map((p) => [p.playerId, p]));
  ORDER = S.boardView.turnOrder;
  if (!state.tab) state.tab = state.m === '1' ? 'table' : 'kiln';
}
const pc = (id) => SEAT[G.players[id].seatIndex] ?? '#555';
const pname = (id) => G.players[id].displayName;
const initial = (id) => pname(id).slice(0, 1);
const kilnName = (id) => tr(LB.kilns[G.players[id].kilnId]);
const glazeName = (g) => g ? tr(LB.glazes[g]) : '';
const qName = (q) => q ? tr(LB.qualities[q]) : '';
const locName = (id) => tr(LB.locations[id]);
const resName = (r) => tr(LB.resources[r]);
const ruleErr = (code, details = {}) => {
  const t = LB.ruleErrors[code]; if (!t) return code;
  let s = tr(t);
  const v = { ...details }; if (v.locationId) v.locationId = locName(v.locationId); if (v.resource) v.resource = resName(v.resource === 'coin' ? 'coins' : v.resource);
  for (const [a, b] of Object.entries(v)) s = s.split('{' + a + '}').join(b);
  return s.replace(/\{locationId\}/g, '').replace(/\{[a-z]+\}/gi, '');
};
const spaceShort = (spaceId) => { if (!spaceId) return u('imperialShort'); const [z, n] = spaceId.split('_'); return state.lang === 'zh' ? tr(LB.zones[z]).slice(0, 1) + n : z[0].toUpperCase() + n; };
const spaceLong = (spaceId) => { const [z, n] = spaceId.split('_'); return tr(LB.zones[z]) + ' ' + n; };

function cer(c, size = 36, opts = {}) {
  if (!c) return '';
  const g = c.glaze ? GLAZE[c.glaze] : BISQUE;
  const title = [c.id, tr(LB.shapes[c.shape]), tr(LB.decorations[c.decoration]), c.glaze ? glazeName(c.glaze) : tr({ en: 'unglazed', zh: '素坯' }), c.quality ? qName(c.quality) : ''].filter(Boolean).join(' · ');
  return `<span class="cer ${opts.cls || ''}" style="--s:${size}px;--g:${g};--pc:${pc(c.ownerId)}" title="${esc(title)}"><i class="spr s-${c.shape}-${c.decoration}"></i>${opts.badge !== false ? `<span class="badge">${esc(initial(c.ownerId))}</span>` : ''}</span>`;
}

/* ---------------- top bar ---------------- */
function topBar() {
  const ph = PHASE_OF(G.phase.type);
  const idx = LB.roundPhases.findIndex((p) => p.id === ph);
  const roundTxt = state.lang === 'zh' ? `<span class="k">第</span><b>${G.round}</b><span class="k">/5轮</span>` : `<span class="k">${u('round')}</span><b>${G.round}</b><span class="k">/ 5</span>`;
  return `<header class="topbar">
    <div class="brand"><b>${state.lang === 'zh' ? '开窑' : 'Kiln Opening'}</b><span>${esc(u('conceptA'))}</span></div>
    <div class="roundbox">${roundTxt}</div>
    <ol class="phaserail">${LB.roundPhases.map((p, i) => `<li class="${i === idx ? 'on' : i < idx ? 'done' : ''}">${esc(tr(p))}</li>`).join('')}</ol>
    <div class="die"><span class="k">${u('kilnDie')}</span><span class="pip" title="${esc(u('kilnDie'))}">${G.kilnDie.value}</span></div>

/* ---------------- central board ---------------- */
const workActs = () => M.viewerActs && G.phase.type === 'work_turn';
function placementFor(locId) { return workActs() ? (S.placementOptions || []).find((o) => o.locationId === locId) : null; }
function workerLegal(opt) { if (!opt) return null; return opt.workers.find((w) => w.kind === state.worker) || null; }
function locCard(loc) {
  const lab = LB.locations[loc.locationId];
  const opt = placementFor(loc.locationId); const w = workerLegal(opt);
  const cap = loc.capacity;
  const n = cap == null ? Math.max(loc.occupants.length + 1, 3) : cap;
  let slots = '';
  for (let i = 0; i < n; i++) {
    const o = loc.occupants.find((x) => x.spaceIndex === i);
    if (o) slots += `<span class="slot occ ${o.effect === 'shifu' ? 'shifu' : ''}" style="--pc:${pc(o.playerId)}" title="${esc(pname(o.playerId) + ' · ' + tr(LB.workers[o.kind]) + (o.viaSeniorApprentice ? ' · ' + u('viaSenior') : ''))}">${o.effect === 'shifu' ? (state.lang === 'zh' ? '师' : 'S') : (state.lang === 'zh' ? '徒' : 'A')}</span>`;
    else slots += `<span class="slot ${w && w.legal && i === loc.occupants.length ? 'next' : ''}"></span>`;
  }
  const capTxt = cap == null ? u('unlimited') : (state.lang === 'zh' ? `${cap}${u('spaces')}` : `${cap} ${u('spaces')}`);
  let status = '';
  if (opt) {
    status += w && w.legal ? `<span class="tag ok">${u('open')} · ${state.worker === 'shifu' ? u('shifuWord') : u('appWord')}</span>` : `<span class="tag bad">${u('closed')}</span><span class="k">${esc(ruleErr(w ? w.reason : opt.reason, { locationId: loc.locationId }))}</span>`;
  }
  if (loc.locationId === 'materials_yard' && S.quotes && workActs()) {
    const qa = S.quotes.materialsYardApprentice_2clay_1wood, qs2 = S.quotes.materialsYardShifu_2clay_2wood_withBonus;
    const fmtGain = (q) => Object.entries(q.gain).filter(([, v]) => v).map(([r, v]) => `+${v} ${resName(r)}`).join(' ');
    if (state.worker === 'apprentice' && qa) status += `<div class="quote">${u('example')}: ${esc(fmtGain(qa))}</div>`;
    if (state.worker === 'shifu' && qs2) status += `<div class="quote ${qs2.ok ? '' : 'bad'}">${u('example')}: ${esc(fmtGain(qs2))}${qs2.ok ? '' : ' + 1 ' + resName('coins') + ' → ' + esc(ruleErr(qs2.error.code, qs2.error.details))}</div>`;
  }
  if (loc.locationId === 'commission_market' && S.commissionOptions && workActs()) {
    const c = S.commissionOptions[state.worker];
    status += `<div class="quote">${u('reserve')} ≤${c.maxReservations}${c.lookTopThree ? ' · ' + tr(LB.uiVerbs.find((v) => v.en === 'Look at top 3')) : ''} · ${tr(LB.uiVerbs.find((v) => v.en === 'Blind reserve'))}</div>`;
  }
  if (loc.locationId === 'magistrates_hall' && S.magistratesHallQuote && workActs()) {
    const q = S.magistratesHallQuote[state.worker];
    if (q && q.error) status = `<span class="tag bad">${u('closed')}</span><div class="quote bad">${esc(ruleErr(q.error.code, q.error.details))}</div>`;
  }
  if (loc.usableAtRecognition) status += `<span class="k">${u('recognitionGate')}</span>`;
  const legal = w && w.legal;
  return `<div class="loc ${opt ? (legal ? 'legal' : 'illegal') : ''} ${state.loc === loc.locationId ? 'sel' : ''}" ${legal ? `data-loc="${loc.locationId}" role="button" tabindex="0"` : ''}>
    <h3>${esc(tr(lab))}<small>${esc(state.lang === 'zh' ? lab.en : lab.zh)} · ${esc(capTxt)}</small></h3>
    <div class="slots">${slots}</div>
    ${status ? `<div class="status">${status}</div>` : ''}
    <div class="eff"><p class="a"><b>${state.lang === 'zh' ? '徒' : 'A'}</b>${esc(tr(lab.apprenticeText))}</p><p class="s"><b>${state.lang === 'zh' ? '师' : 'S'}</b>${esc(tr(lab.shifuText))}</p></div>
  </div>`;
}

function ladderData() {

    chips: Object.values(f.ceramics).map((c) => ({ ceramicId: c.ceramicId, glaze: c.glaze, ownerId: c.ownerId, preferredHeat: c.preferredHeat, quality: c.quality, kiln: c.kiln, spaceId: c.spaceId,
      actualHeat: c.first?.actualHeat, finalActualHeat: c.first?.finalActualHeat, heatSource: c.first?.heatSource, positionModifier: c.first?.positionModifier, heatMarker: c.first?.heatMarker, junAdjustment: c.first?.junAdjustment, heatDifference: c.first?.heatDifference })),

function qualityAt(diff, table) { for (const r of table) if (r.maxDifference == null || diff <= r.maxDifference) return r.quality; return 'flawed'; }

  const vals = [0, 6]; L.chips.forEach((c) => { const p = placeOf(c); if (p.h != null) vals.push(p.h); if (c.actualHeat != null) vals.push(c.actualHeat); });

  const axis = `<div class="lrow axis" style="--cols:${cols}"><div class="lh"><small>${tr({ en: 'Heat', zh: '火候' })}</small></div>${hasHidden ? `<div class="cell" title="${esc(u('hiddenTip'))}">${u('hiddenCol')}</div>` : ''}${Array.from({ length: n }, (_, i) => {

    const tip = L.live && L.globalHeat === h ? u('globalHeat') : L.live && L.baseHeat === h ? u('baseHeat') : '';
    return `<div class="cell ${cls}" title="${esc(tip)}">${h}</div>`; }).join('')}</div>`;
  const lanes = L.preferredHeatBands.map((b) => {

    const ceramicOf = (c) => G.ceramics[c.ceramicId] || { id: c.ceramicId, shape: 'bowl', decoration: 'plain', glaze: c.glaze, ownerId: c.ownerId };
    const hiddenCell = hasHidden ? `<div class="cell gutter">${chips.filter((c) => placeOf(c).kind === 'hidden').map((c) => cer({ ...ceramicOf(c), glaze: c.glaze }, 28, { cls: focus.has(c.ceramicId) ? 'focus' : '' })).join('')}</div>` : '';
    const cells = Array.from({ length: n }, (_, i) => {
      const h = lo + i; const q = qualityAt(Math.abs(h - b.preferredHeat), L.qualityByHeatDifference);

        here.map((c) => cer({ ...ceramicOf(c), glaze: c.glaze, quality: c.quality }, 28, { cls: [placeOf(c).kind === 'preview' ? 'preview' : '', focus.has(c.ceramicId) ? 'focus' : ''].join(' ') })).join('');

  const sp = spaces.map((s, i) => {
    if (!s.unlocked) return `<div class="psp lock" data-lock="${esc(u('lockToken'))}" title="${esc(u('unlockWith', { d: tr(LB.disciplines[discFor]) }))}"></div>`;
    if (s.occupant) return `<div class="psp occ" style="--pc:${pc(s.occupant.playerId)}" title="${esc(locId === 'glaze_load' && s.occupant.effect === 'shifu' ? u('stays') : '')}"><span class="slot occ ${s.occupant.effect === 'shifu' ? 'shifu' : ''}" style="--pc:${pc(s.occupant.playerId)}">${s.occupant.effect === 'shifu' ? (state.lang === 'zh' ? '师' : 'S') : (state.lang === 'zh' ? '徒' : 'A')}</span></div>`;
    const isNext = opt && w && w.legal && opt.nextSpaceIndex === i;
    return `<div class="psp ${isNext ? 'legal' : ''}" ${isNext ? `data-loc="${locId}" role="button" tabindex="0"` : ''}>${i + 1}</div>`;
  }).join('');
  let st = '';
  if (opt) {
    if (w && w.legal) st = `<span class="tag ok">${u('open')}</span>`;
    else {
      st = `<span class="tag bad">${u('closed')}</span>`;
      const qk = state.worker === 'shifu' ? 'formDecorateShifu_bowl_plain_plus_vase_carved' : 'formDecorateApprentice_bowl_carved';
      const q = locId === 'form_decorate' && S.quotes ? S.quotes[qk] : null;
      st += ` <span class="small muted">${esc(q && q.error ? ruleErr(q.error.code, q.error.details) : ruleErr(w ? w.reason : opt.reason, { locationId: locId }))}</span>`;
    }
  }
  const extra = locId === 'glaze_load' && state.loc === 'glaze_load' && S.loadDestinationOptions ? `<span class="small muted">${esc(u('loadTargets', { c: S.loadDestinationOptions.ceramicId }))}: ${S.loadDestinationOptions.options.map((o) => spaceShort(o.destination.spaceId)).join(' ')}</span>` : '';
  return `<section class="pl" style="grid-area:${locId === 'form_decorate' ? 'fd' : 'gl'}"><div class="lt"><b>${esc(tr(lab))}</b>${unlocker ? `<span class="small">${esc(u('unlockedBy', { t: tr(LB.techs[unlocker.techId]) }))}</span>` : spaces.some((x) => !x.unlocked) ? `<span class="small">${esc(u('unlockWith', { d: tr(LB.disciplines[discFor]) }))}</span>` : ''}<span class="small" title="${esc(tr(lab.apprenticeText) + '\n' + tr(lab.shifuText))}">${st || esc(tr(lab.apprenticeText))}</span>${extra}</div>${sp}</section>`;
}
function playerMat() {
  const p = PS[V]; const raw = G.players[V]; const k = LB.kilns[p.kilnId];
  const prev = (S.scorePreviews || []).find((s) => s.playerId === V);
  const hm = p.heatMarkerCeramicId ? `${u('on')} ${p.heatMarkerCeramicId}` : u('inSupply');
  const byDisc = ['workshop', 'glazing_loading', 'firing'].map((d) => {
    const t = p.techs.find((x) => x.discipline === d);
    return t ? `<div class="tslot" style="--dc:${DCOL[d]}"><b>${esc(tr(LB.techs[t.techId]))}</b>${t.oncePerRound ? `<span class="tag ${t.ready ? 'ready' : 'used'}">${t.ready ? u('ready') : u('used')}</span>` : ''}</div>`
      : `<div class="tslot empty" style="--dc:${DCOL[d]}">${esc(tr(LB.disciplines[d]))} · ${u('emptySlot')}</div>`;
  }).join('');
  const C = (id) => G.ceramics[id];
  const wsItem = (c, sub) => `<div class="wsitem">${cer(c, 40, { badge: false })}<span><b>${c.id}</b></span><span class="muted">${esc(sub)}</span></div>`;
  const shaped = p.shapedCeramicIds.map((id) => wsItem(C(id), `${tr(LB.shapes[C(id).shape])} · ${tr(LB.decorations[C(id).decoration])}`)).join('');
  const loaded = p.loadedCeramicIds.map((id) => wsItem(C(id), `${glazeName(C(id).glaze)} · ${C(id).placement.kiln === 'imperial' ? u('impKiln') : spaceShort(C(id).placement.spaceId)}`)).join('');
  const fin = p.finishedCeramicIds.map((id) => wsItem(C(id), `${qName(C(id).quality)}`)).join('');
  const ic = p.imperial.kilnCeramic;
  const imp = p.imperial.kilnGained
    ? `<section class="impslot"><b>${u('impKiln')}</b>${ic ? cer(ic, 34, { badge: false }) + `<span>${ic.id}</span>${heatToken(ic.heatMarker, V)}` : `<span class="k">${u('impEmpty')}</span>`}<span class="modchip" style="margin-left:auto" title="${esc(u('impMod'))}">${LB.imperialModifiers.map((m) => `<span class="${ic && m === ic.placement.imperialModifier ? 'on' : ''}">${signed(m)}</span>`).join('')}</span></section>`
    : `<section class="impslot locked"><b>${u('impKiln')}</b><span>${u('impLocked')}</span></section>`;
  return `<div class="mat sec-mat" data-tab="workshop" style="--pc:${pc(V)}">
    <h2 class="tabhead mobile-only">${u('yourBoard')}</h2>
    <section class="sid">
      <div class="nm"><b>${esc(p.displayName)}</b><span class="k">${esc(tr(k))}</span>${p.isFirstPlayer ? `<span class="tag fp">${u('first')}</span>` : ''}</div>
      ${res(p.resources, true)}
      <div class="small"><b class="num">${p.recordedVp}</b> ${u('recordedVp')} · <span class="muted">${prev ? prev.breakdown.total : '—'} ${u('ifScored')}</span><br>${u('recog')} <b>${p.recognition}</b>/4 · ${u('heatMarker')}: ${esc(hm)}</div>
      <div class="trad"><span class="k">${u('kilnTradition')}</span> <b>${esc(tr(k.abilityName))}</b> <span class="tag ${p.kilnAbilityReady ? 'ready' : 'used'}">${p.kilnAbilityReady ? u('ready') : u('used')}</span><p>${esc(tr(k.shortText))}</p></div>
    </section>
    ${personalLoc('form_decorate', p)}
    ${personalLoc('glaze_load', p)}
    <section class="ws"><div class="wsgroups">
      <div><span class="k">${u('workshop')} · ${u('shaped')}</span><div class="wsrow">${shaped || `<span class="k">${u('none')}</span>`}</div></div>
      ${loaded ? `<div><span class="k">${u('inKiln')}</span><div class="wsrow">${loaded}</div></div>` : ''}
      <div><span class="k">${u('finishedArea')}</span><div class="wsrow">${fin || `<span class="k">${u('none')}</span>`}</div></div></div></section>
    <section class="techslots">${byDisc}</section>
    ${imp}
  </div>`;
}
function handPanel() {
  const hl = (S.handLimitStatus || {})[V];
  return `<section class="panel hand sec-hand" data-tab="orders"><header><h2>${u('handTitle')}</h2><span class="tag priv">${u('priv')}</span><span class="aside">${M.own.orderHand.length} / ${u('limit')} ${hl ? hl.limit : '—'} · ${u('checkedAtCleanup')}</span></header>
    <div class="handrow">${M.own.orderHand.map((id) => orderCard(id)).join('')}</div></section>`;
}

/* ---------------- tabs (phone) ---------------- */
const ICON = {
  table: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>',
  kiln: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V10a7 7 0 0 1 14 0v10z"/><path d="M9 20v-4a3 3 0 0 1 6 0v4"/></svg>',
  workshop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 4h8M9 4c0 3-3 4-3 9a6 6 0 0 0 12 0c0-5-3-6-3-9"/></svg>',
  orders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
};
function tabBar() {
  const want = G.phase.type.startsWith('firing') ? 'kiln' : state.loc === 'form_decorate' || state.loc === 'glaze_load' ? 'workshop' : 'table';
  const lab = { table: u('tabTable'), kiln: u('tabKiln'), workshop: u('tabWorkshop'), orders: u('tabOrders') };
  return `<nav class="tabbar" aria-label="tabs">${['table', 'kiln', 'workshop', 'orders'].map((t) => `<button class="${state.tab === t ? 'on' : ''}" data-tab-btn="${t}">${ICON[t]}<span>${lab[t]}</span>${M.viewerActs && want === t && state.tab !== t ? '<span class="dot"></span>' : ''}</button>`).join('')}</nav>`;
}

/* ---------------- compose ---------------- */
function render() {
  load();
  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
  document.body.dataset.tab = state.tab;
  document.body.classList.toggle('firing', G.phase.type.startsWith('firing'));
  const opps = ORDER.filter((id) => id !== V).map((id) => oppStrip(PS[id])).join('');
  document.getElementById('app').innerHTML = `
    ${topBar()}
    <main class="left">
      <section class="opps sec-opps" data-tab="table" aria-label="${esc(u('opponents'))}">${opps}</section>
      ${centralBoard()}
      ${mainOrders()}
      ${handPanel()}
      <div class="band">${techDisplay()}${recognitionTrack()}</div>
    </main>
    <aside class="right">${sharedKiln()}${firingStage()}</aside>
    <section class="dock">${decisionBar()}${playerMat()}</section>
    ${tabBar()}`;
  const dec = document.querySelector('.decision');
  if (dec) document.body.style.setProperty('--decH', dec.offsetHeight + 'px');
  const p = new URLSearchParams({ m: state.m, lang: state.lang, tab: state.tab });
  history.replaceState(null, '', '?' + p.toString());
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-worker],[data-loc],[data-tab-btn],#lang');
  if (!t) return;
  if (t.id === 'lang') state.lang = state.lang === 'en' ? 'zh' : 'en';
  else if (t.dataset.worker) { state.worker = t.dataset.worker; state.loc = null; }
  else if (t.dataset.loc) state.loc = state.loc === t.dataset.loc ? null : t.dataset.loc;
  else if (t.dataset.tabBtn) { state.tab = t.dataset.tabBtn; window.scrollTo(0, 0); }
  render();
});
document.addEventListener('change', (e) => { if (e.target.id === 'msel') { state.m = e.target.value; state.tab = null; state.loc = null; render(); } });
window.addEventListener('resize', () => { const dec = document.querySelector('.decision'); if (dec) document.body.style.setProperty('--decH', dec.offsetHeight + 'px'); });
render();
})();
</script>
</body>
</html>
