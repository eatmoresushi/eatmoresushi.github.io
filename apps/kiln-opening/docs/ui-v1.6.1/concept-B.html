<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln at the Heart</title>
<!--
  Kiln Opening V1.6.1 — UI wireframe concept B "Kiln at the Heart".
  Mid-fidelity. All game data is inlined from docs/ui-v1.6.1/fixtures.json (real engine states).
  URL params: ?m=1|3|4  &lang=en|zh  &tab=table|kiln|workshop|orders  &drawer=open|closed
  Nothing here recomputes rules: every legal option, quote, Heat value and Quality comes from a selector.
  Items marked † are display conveniences that need a selector the engine does not yet expose.
-->
<style>
:root{
  --paper:#f5f0e6; --paper-deep:#e7ddcb; --porcelain:#fffdf8; --ink:#17201d; --ink-soft:#4e5b55; --ink-faint:#6f7a74;
  --teal:#21504a; --teal-2:#2f6b62; --celadon:#7f9c8c; --celadon-pale:#dbe7df; --cinnabar:#a63e32; --gold:#b8893f; --gold-pale:#f1e4c4;
  --line:#cfc4b2; --line-soft:#e2d9c8;
  --d-workshop:#76703f; --d-workshop-pale:#ebe6cf; --d-glazing:#2f7480; --d-glazing-pale:#d6e8ea; --d-firing:#a4532e; --d-firing-pale:#f3ddd0;
  --p1:#7a4a86; --p2:#2e5a8c; --p3:#a0701a; --p4:#56606a;
  --q-masterpiece:#ecd79d; --q-fine:#cfe2d6; --q-standard:#ece6da; --q-flawed:#f2d3cb;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Songti SC","STSong",Georgia,serif;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Segoe UI",sans-serif;
  --r:10px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.serif{font-family:var(--serif)}
.small{font-size:12px}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- App frame ---------- */
.app{min-height:100vh}
.hdr{display:flex;align-items:center;gap:14px;padding:6px 14px;background:var(--teal);color:#f4efe2;min-height:44px}
.brand{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.brand small{font-size:12px;opacity:.75;font-family:var(--sans);margin-left:6px;font-weight:500}
.phases{display:flex;gap:2px;align-items:center;flex:1;min-width:0}
.phase{font-size:13px;padding:3px 9px;border-radius:999px;color:#cfe0d9;white-space:nowrap}
.phase.cur{background:#f4efe2;color:var(--teal);font-weight:700}
.phase.done{color:#9fbab0}
.phase-sep{color:#7fa59a;font-size:12px}
.hdr .round{font-size:13px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:#e7efe9;padding:4px 10px;font-size:13px;min-height:30px}
.seg button[aria-pressed=true]{background:#f4efe2;color:var(--teal);font-weight:700}
.wf{border:1px dashed rgba(255,255,255,.5);border-radius:8px;padding:2px 4px 2px 8px;display:flex;align-items:center;gap:6px}
.wf > span{font-size:12px;opacity:.8}
.wf select{font:13px var(--sans);min-height:30px;border-radius:6px;border:0;background:#f4efe2;color:var(--teal)}

.dec{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--porcelain);border-bottom:1px solid var(--line);min-height:52px}
.dec.act{background:linear-gradient(90deg,#e4efe8,var(--porcelain) 60%);border-bottom:2px solid var(--teal-2)}
.dec .who{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-2);white-space:nowrap}
.dec h2{font-family:var(--serif);font-size:19px;font-weight:600;white-space:nowrap}
.dec .sub{font-size:13px;color:var(--ink-soft);min-width:0}
.dec .grow{flex:1;min-width:0}
.queue{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.queue b{color:var(--ink)}
.wtray{display:flex;gap:6px;align-items:center}
.wbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px 4px 4px;min-height:34px;font-size:13px}
.wbtn[aria-pressed=true]{border-color:var(--teal-2);box-shadow:0 0 0 2px var(--teal-2) inset;font-weight:700}
.meeple{width:22px;height:22px;border-radius:50% 50% 40% 40%;background:var(--pc,#888);display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:800;flex:none}
.meeple.shifu{border-radius:4px;box-shadow:0 0 0 2px #fff inset}
.meeple.off{opacity:.3}

.dec{flex-wrap:wrap}
.dopts{flex-basis:100%;display:flex;gap:10px;align-items:stretch}
.dopts .opts{flex:1;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.dopts .dside{display:flex;flex-direction:column;gap:6px;justify-content:center;max-width:260px}
.kstage .dcard{display:none}
.tabs{display:none}
.ribbon{display:none}

/* ---------- Panels ---------- */
.panel{background:var(--porcelain);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.ptitle{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.ptitle h3{font-family:var(--serif);font-size:16px;font-weight:600}
.ptitle .aside{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--paper-deep);color:var(--ink-soft);white-space:nowrap}
.tag.priv{background:#2b2f2d;color:#f2ede1}
.tag.gold{background:var(--gold-pale);color:#6e5120}
.tag.teal{background:var(--celadon-pale);color:var(--teal)}
.tag.warn{background:#f6dcd5;color:#7d2b22}
.pdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
.gap-note{font-size:12px;color:#8a6a2c}

/* ---------- Opponents strip ---------- */
.opps{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.opp{background:var(--porcelain);border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:var(--r);padding:7px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.opp .nm{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center}
.opp .kiln{font-size:12px;color:var(--ink-soft)}
.opp .vp{font-family:var(--serif);font-size:22px;font-weight:600;text-align:right;line-height:1}
.opp .vp small{font-size:12px;font-family:var(--sans);color:var(--ink-soft);font-weight:500}
.opp .row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-soft);align-items:center}
.res{display:inline-flex;gap:8px;font-size:13px;color:var(--ink)}
.res i{font-style:normal;color:var(--ink-soft);font-size:12px;margin-right:2px}
.cardbacks{display:inline-flex;align-items:center;gap:2px}
.cardbacks span{width:9px;height:13px;border-radius:2px;background:var(--teal-2);border:1px solid #fff;margin-left:-4px;box-shadow:0 0 0 1px var(--teal-2)}
.cardbacks span:first-child{margin-left:0}
.mini-slots{display:inline-flex;gap:3px}
.mini-slots span{width:16px;height:16px;border-radius:3px;border:1px solid var(--line);background:#fff;font-size:12px;line-height:14px;text-align:center}
.mini-slots .w{background:var(--d-workshop-pale);border-color:var(--d-workshop)}
.mini-slots .g{background:var(--d-glazing-pale);border-color:var(--d-glazing)}
.mini-slots .f{background:var(--d-firing-pale);border-color:var(--d-firing)}
.mini-slots .lock{background:repeating-linear-gradient(45deg,#e9e1d1 0 3px,#d8cdb8 3px 6px)}
.mini-slots .occ{background:var(--pc);border-color:var(--pc)}

/* ---------- Locations ---------- */
.rail{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;padding:1px}
.loc{background:var(--porcelain);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.loc.legal{border-color:var(--teal-2);box-shadow:0 0 0 1px var(--teal-2)}
.loc.illegal{background:#f7f3ea}
.loc-h{display:flex;align-items:center;gap:6px}
.loc-h h4{font-family:var(--serif);font-size:15px;font-weight:600;flex:1;min-width:0}
.caps{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.cap{width:14px;height:14px;border-radius:50%;border:1.5px dashed var(--line);background:#fff}
.cap.f{border:0;background:var(--pc)}
.cap.f.s{border-radius:3px}
.cap.inf{width:auto;height:auto;border:0;background:none;font-size:12px;color:var(--ink-soft)}
.eff{font-size:12px;line-height:1.35;color:var(--ink-soft)}
.eff b{color:var(--ink);font-weight:700}
.eff.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.loc-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.place{border:1px solid var(--teal-2);background:var(--teal-2);color:#fff;border-radius:7px;padding:4px 10px;font-size:13px;font-weight:600;min-height:32px}
.place:disabled{background:#efe9dc;border-color:var(--line);color:var(--ink-faint);font-weight:500}
.why{font-size:12px;color:#7d2b22;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.quote{font-size:12px;color:var(--teal);line-height:1.3}
.quote.faint{color:var(--ink-faint)}
.app.firing .loc-h{flex-wrap:wrap}.app.firing .loc-h h4{flex-basis:100%}
.app.firing .loc .eff,.app.firing .loc .loc-a,.app.firing .loc .why,.app.firing .loc .quote{display:none}
.recog{display:flex;flex-direction:column;gap:3px}
.rc{border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:#fff;display:flex;gap:7px;align-items:center;min-height:28px}
.rc .n{font-family:var(--serif);font-weight:700;font-size:15px;line-height:1}
.rc .t{font-size:12px;line-height:1.15;color:var(--ink-soft);flex:1}
.rc.imp{background:var(--gold-pale);border-color:#d9bf86}
.rc .dots{display:flex;gap:2px}

/* ---------- Kiln stage ---------- */
.kstage{background:linear-gradient(180deg,#efe6d6,#f6efe2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;position:relative}
.kst-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kst-head h3{font-family:var(--serif);font-size:18px;font-weight:600}
.kst-body{display:grid;gap:10px;min-height:0}
.kst-body.work{grid-template-columns:minmax(0,1fr) 210px}
.kst-body.firing{grid-template-columns:330px minmax(0,1fr);align-items:start}
.kcolA{display:flex;flex-direction:column;gap:8px;min-width:0}
.app.firing .zrow{grid-template-columns:42px repeat(3,minmax(0,1fr));gap:5px}
.app.firing .zl b{font-size:13px}
.app.firing .sp .qb{padding:0 3px}
.app.firing .vault{padding:22px 8px 8px}
.app.firing .cer{flex-direction:column;align-items:flex-start;gap:1px}
.app.firing .cer .spr{--s:28px !important}
.vault{position:relative;background:#3a2f27;border-radius:46% 46% 12px 12px / 22% 22% 12px 12px;padding:22px 12px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 3px #5b4a3c,inset 0 -30px 50px rgba(184,80,40,.25)}
.vault::before{content:attr(data-webgl);position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:12px;color:#c9b8a4;opacity:.75;white-space:nowrap}
.zrow{display:grid;grid-template-columns:62px repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.zl{color:#f0e3cf;font-size:12px;display:flex;flex-direction:column;justify-content:center;line-height:1.2}
.zl b{font-family:var(--serif);font-size:15px;font-weight:600}
.zl .mod{font-size:13px;color:#f6b98a;font-weight:700}
.zl.high .mod{color:#ff9f6e}.zl.low .mod{color:#d7c7a0}
.sp{background:#f6efe3;border-radius:8px;min-height:72px;padding:5px;display:flex;flex-direction:column;gap:3px;position:relative;border:1.5px solid transparent}
.sp.empty{background:rgba(246,239,227,.16);border:1.5px dashed rgba(246,239,227,.45);color:#e8dccb;align-items:center;justify-content:center;font-size:12px}
.sp.cov{background:repeating-linear-gradient(135deg,#4a3d33 0 6px,#3f342b 6px 12px);color:#b9a790;align-items:center;justify-content:center;font-size:12px;text-align:center}
.sp.mine{border-color:var(--gold)}
.sp .spid{position:absolute;top:3px;right:6px;font-size:12px;color:var(--ink-faint)}
.sp.empty .spid,.sp.cov .spid{color:#b9a790}
.app.firing .sp{min-height:66px}
.furn{font-size:12px;background:#8a6b4c;color:#fff;border-radius:4px;padding:0 5px;align-self:flex-start}
.imps{display:flex;gap:8px;flex-wrap:wrap}
.imp{background:linear-gradient(180deg,#fbf3df,#f3e5c3);border:1.5px solid var(--gold);border-radius:10px;padding:6px 8px;display:flex;gap:8px;align-items:center;min-width:0}
.imp h5{margin:0;font-size:12px;font-weight:700;color:#6e5120}
.dock{display:flex;flex-direction:column;gap:8px}
.bignum{display:flex;align-items:center;gap:10px}
.die{width:46px;height:46px;border-radius:9px;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--serif);font-size:26px;font-weight:700;flex:none}
.firecards{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.fc{min-width:30px;height:38px;border-radius:5px;display:grid;place-items:center;font-weight:700;font-size:14px;background:#fff;border:1px solid var(--d-firing);color:var(--d-firing)}
.fc.back{background:repeating-linear-gradient(45deg,var(--d-firing) 0 4px,#b9653f 4px 8px);color:#fff;border-color:#7e3d20;min-width:38px}
.fc.cur{background:var(--d-firing);color:#fff;box-shadow:0 0 0 3px var(--d-firing-pale)}

/* ceramics */
.spr{position:relative;display:inline-block;width:var(--s,36px);height:var(--s,36px);flex:none}
.spr img{width:100%;height:100%;object-fit:contain;display:block}
.spr::after{content:"";position:absolute;inset:0;background:var(--tint,transparent);-webkit-mask:var(--img) center/contain no-repeat;mask:var(--img) center/contain no-repeat;mix-blend-mode:multiply}
.g-white{--tint:#efe9d8}.g-celadon{--tint:#9fc0a6}.g-grey_green{--tint:#93a083}.g-moon_white{--tint:#bccfdc}.g-none{--tint:#d8bd98}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.25);vertical-align:-1px;background:var(--tint)}
.cer{display:flex;gap:5px;align-items:flex-start;min-width:0}
.cer .ci{min-width:0;display:flex;flex-direction:column;gap:1px}
.cer .cid{font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.cer .attr{font-size:12px;color:var(--ink-soft);line-height:1.25}
.app.firing .cer .attr{display:none}
.mk{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:800;color:#fff;background:var(--pc);border:2px solid #fff;box-shadow:0 0 0 1px var(--pc);padding:0 3px}
.mk.fd{background:repeating-linear-gradient(45deg,var(--pc) 0 3px,rgba(255,255,255,.35) 3px 5px)}
.mk.km{border-radius:4px}
.qb{font-size:12px;font-weight:700;padding:0 6px;border-radius:4px;white-space:nowrap}
.qb.masterpiece{background:var(--q-masterpiece);color:#5b4210}.qb.fine{background:var(--q-fine);color:#1f4a3a}.qb.standard{background:#ddd5c5;color:#3f3a31}.qb.flawed{background:var(--q-flawed);color:#7d2b22}

/* firing stage */
.fstage{display:flex;flex-direction:column;gap:8px;min-width:0}
.steps{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink-soft)}
.st.done{background:var(--celadon-pale);border-color:var(--celadon);color:var(--teal)}
.st.cur{width:auto;border-radius:999px;padding:0 10px;background:var(--d-firing);border-color:var(--d-firing);color:#fff;font-size:13px}
.eq{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.eqb{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 8px;display:flex;flex-direction:column;justify-content:center;min-width:64px}
.eqb .l{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.eqb .v{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.1}
.eqb.key{border-color:var(--d-firing);box-shadow:0 0 0 1px var(--d-firing)}
.eqb.unk .v{color:var(--ink-faint)}
.eqop{align-self:center;font-size:18px;color:var(--ink-soft)}
.contribs{display:flex;flex-direction:column;gap:1px;font-size:12px}
.contribs span{display:flex;gap:5px;align-items:center;white-space:nowrap}
.dcard{background:var(--porcelain);border:2px solid var(--teal-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.dcard h4{font-family:var(--serif);font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.opt{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:44px}
.opt:hover{border-color:var(--teal-2)}
.opt .ot{font-weight:700;font-size:14px;color:var(--teal)}
.opt .od{font-size:12px;color:var(--ink-soft);line-height:1.3}
.opt.pri{border-color:var(--teal-2);box-shadow:0 0 0 1px var(--teal-2)}
.dfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;min-height:34px}
.btn.pri{background:var(--teal-2);border-color:var(--teal-2);color:#fff;font-weight:700}
.odds{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.odds span{font-size:12px;border-radius:4px;padding:1px 5px;white-space:nowrap}

/* ladder */
.ladder{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.lad{display:grid;grid-template-columns:var(--lw,118px) repeat(8,minmax(0,1fr)) var(--pw,0px);row-gap:4px}
.lad .hc{font-size:12px;color:var(--ink-soft);text-align:center;padding-bottom:2px;border-bottom:1px solid var(--line-soft)}
.lad .hc.bh{color:var(--d-firing);font-weight:800}
.lrow{display:contents}
.lname{grid-column:1;display:grid;grid-template-columns:14px 1fr;align-content:center;column-gap:5px;font-size:13px;font-weight:600;padding-right:6px;min-height:50px;line-height:1.2}
.lname .swatch{grid-row:1/3;align-self:center}
.lname small{font-weight:500;color:var(--ink-soft);font-size:12px}
.lcells{grid-column:2 / span 8;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));position:relative}
.band{grid-row:1;border-left:1px solid #fff;min-height:50px}
.band.d0{background:var(--q-masterpiece)}.band.d1{background:var(--q-fine)}.band.d2{background:var(--q-standard)}.band.d3{background:#faf6ef}
.band.pref{box-shadow:inset 0 0 0 2px #b08a3a}
.rng{grid-row:1;align-self:center;height:6px;border-radius:3px;background:rgba(164,83,46,.25);margin:0 8px;z-index:1}
.slot{grid-row:1;display:flex;flex-wrap:wrap;gap:3px;align-items:center;justify-content:center;z-index:2;padding:2px}
.chip{display:flex;flex-direction:column;align-items:center;gap:0;background:#fff;border:2px solid var(--pc);border-radius:9px;padding:1px 3px;font-size:12px;line-height:1.1;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15);white-space:nowrap}
.chip.me{box-shadow:0 0 0 2px var(--gold),0 1px 3px rgba(0,0,0,.2)}
.chip.imp{border-style:double;border-width:3px}
.chip.ghost{opacity:.45;border-style:dashed;box-shadow:none}
.chip .spr{--s:22px}
.pend{grid-column:10;display:flex;flex-wrap:wrap;gap:3px;align-items:center;justify-content:center;border-left:1px dashed var(--line);padding-left:4px}
.lgd{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:6px;align-items:center}
.lgd i{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:3px}

/* ---------- Market column ---------- */
.mkt{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;padding:1px}
.odisp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ocard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--teal-2);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ocard.crown{border-top-color:var(--gold);background:linear-gradient(180deg,#fdf8ea,#fff 40%)}
.ocard.start{border-top-color:var(--d-workshop)}
.ocard .oh{display:flex;gap:6px;align-items:baseline;font-size:12px;color:var(--ink-soft)}
.ocard .oh b{font-size:13px;color:var(--ink)}
.ocard .req{font-size:13px;line-height:1.3}
.ocard .oq{font-size:12px;color:var(--ink-soft)}
.ocard .rw{font-size:13px;font-weight:700;margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.ocard .rw .vpv{font-family:var(--serif);font-size:16px}
.oslot{font-size:12px;color:var(--ink-faint)}
.techs{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tlabel{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.04em}
.tcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--dc);border-radius:7px;padding:5px 7px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tcard .tn{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:4px}
.tcard .tt{font-size:12px;color:var(--ink-soft);line-height:1.3;white-space:pre-line}
.tcard .tl{font-size:12px}
.dw{--dc:var(--d-workshop)}.dg{--dc:var(--d-glazing)}.df{--dc:var(--d-firing)}
.log{font-size:12px;color:var(--ink-soft);display:flex;flex-direction:column;gap:2px}

/* ---------- Own drawer ---------- */
.drawer{background:var(--porcelain);border-top:3px solid var(--pc);box-shadow:0 -8px 24px rgba(41,34,26,.12);padding:8px 14px 10px}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead .nm{font-family:var(--serif);font-size:17px;font-weight:600;display:flex;gap:8px;align-items:center}
.dgrid{display:grid;grid-template-columns:230px minmax(0,1.7fr) minmax(0,1fr) 220px;gap:10px;margin-top:8px}
.pspaces{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.pspaces > h4{grid-column:1/-1}
.pspaces{align-content:start;align-items:start}
.app.firing .opp .wk{display:none}
.hand .ocard .req{font-size:12px}
.hand .ocard{padding:5px 7px}
.drawer.closed .dgrid{display:none}
.box{border:1px solid var(--line-soft);border-radius:9px;padding:7px 9px;background:#fff;min-width:0}
.box h4{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;display:flex;gap:6px;align-items:center}
.trad{font-size:12px;color:var(--ink-soft);white-space:pre-line;line-height:1.35;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pspaces{display:grid;gap:6px}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pl h5{grid-column:1/-1;margin:0;font-size:13px;font-family:var(--serif);font-weight:600;display:flex;gap:6px;align-items:center}
.ps{border:1.5px dashed var(--line);border-radius:7px;min-height:44px;padding:4px 6px;font-size:12px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.ps.lock{border-style:solid;background:repeating-linear-gradient(45deg,#efe7d6 0 6px,#e4d9c3 6px 12px);color:#5e5240}
.ps.legal{border:1.5px solid var(--teal-2);background:#eef5f1}
.ps.illegal{background:#f7f3ea}
.ps .lk{font-weight:700}
.tslots{display:flex;flex-direction:column;gap:5px}
.tslot{border:1px dashed var(--dc);border-radius:7px;padding:4px 7px;font-size:12px;border-left:4px solid var(--dc);min-height:34px}
.tslot.has{border-style:solid;background:#fff}
.cers{display:flex;flex-wrap:wrap;gap:8px}
.hand{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.collapsed-only{display:none}
.drawer.closed .collapsed-only{display:flex}

/* ---------- Desktop grid ---------- */
@media (min-width:1100px){
  .app{height:100vh;display:grid;grid-template-columns:228px minmax(0,1fr) 228px 316px;grid-template-rows:auto auto auto minmax(0,1fr) auto;
    grid-template-areas:"hdr hdr hdr hdr" "dec dec dec dec" "opp opp opp mkt" "lft kln rgt mkt" "drw drw drw drw";column-gap:10px;overflow:hidden}
  .app.firing{grid-template-columns:160px minmax(0,1fr) 300px;grid-template-rows:auto auto auto auto minmax(0,1fr) auto;
    grid-template-areas:"hdr hdr hdr" "dec dec dec" "opp opp mkt" "lft kln mkt" "rgt kln mkt" "drw drw drw"}
  .app.firing .rail.r{padding-left:10px}
  .app.firing .rail.l{padding-bottom:0;overflow:visible}
  .hdr{grid-area:hdr}.dec{grid-area:dec}
  .opps{grid-area:opp;padding:8px 0 8px 10px}
  .rail.l{grid-area:lft;padding-left:10px;padding-bottom:8px}
  .rail.r{grid-area:rgt;padding-bottom:8px}
  .kstage{grid-area:kln;margin-bottom:8px}
  .mkt{grid-area:mkt;padding:8px 10px 8px 0}
  .drawer{grid-area:drw}
  .drawer:not(.closed) .dgrid{max-height:34vh;overflow:auto}
}
@media (min-width:1100px) and (max-height:800px){
  .opp{padding:5px 9px}.dec{min-height:46px;padding:5px 14px}
  .drawer:not(.closed) .dgrid{max-height:30vh}
  .sp{min-height:62px}
  .app.firing .dec{padding:5px 14px}
}
/* ---------- Tablet ---------- */
@media (min-width:760px) and (max-width:1099px){
  .app{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:10px}
  .hdr,.dec,.opps,.kstage,.drawer{grid-column:1/-1}
  .opps,.rail,.mkt,.kstage{margin:0 10px}
}
/* ---------- Phone ---------- */
@media (max-width:759px){
  body{font-size:14px}
  .app{display:flex;flex-direction:column}
  .sticky{position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .hdr{flex-wrap:wrap;gap:6px 10px;padding:6px 12px}
  .hdr .phases{order:5;flex-basis:100%;overflow-x:auto;scrollbar-width:none}
  .phase{font-size:12px;padding:2px 7px}
  .brand small{display:none}
  .dec{flex-wrap:wrap;gap:4px 10px;padding:7px 12px;min-height:0}
  .dec h2{font-size:17px;white-space:normal}
  .dec .sub{flex-basis:100%;font-size:12px}
  .dec .queue{display:none}
  .wtray{flex-basis:100%}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--porcelain);border-bottom:1px solid var(--line)}
  .tabs button{border:0;background:none;padding:9px 2px 7px;font-size:14px;color:var(--ink-soft);border-bottom:3px solid transparent;min-height:44px;position:relative}
  .tabs button[aria-selected=true]{color:var(--teal);font-weight:700;border-bottom-color:var(--teal-2)}
  .tabs .badge{position:absolute;top:5px;margin-left:3px;min-width:16px;height:16px;border-radius:8px;background:var(--cinnabar);color:#fff;font-size:12px;line-height:16px;padding:0 4px;font-weight:700}
  .ribbon{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#3a2f27;color:#f0e3cf;font-size:12px;border:0;width:100%;text-align:left}
  .ribbon .mk8{display:grid;grid-template-columns:repeat(3,10px);gap:2px}
  .ribbon .mk8 span{width:10px;height:10px;border-radius:2px;background:rgba(246,239,227,.25)}
  .ribbon .mk8 span.c{background:repeating-linear-gradient(135deg,#6a5a4b 0 2px,#4a3d33 2px 4px)}
  .ribbon .mk8 span.o{background:#f6efe3}
  .app[data-tab=kiln] .ribbon{display:none}
  .app [data-pt]{display:none}
  .app[data-tab=table] [data-pt~=table],.app[data-tab=kiln] [data-pt~=kiln],.app[data-tab=workshop] [data-pt~=workshop],.app[data-tab=orders] [data-pt~=orders]{display:flex}
  .app[data-tab=table] .opps{display:grid}
  .app[data-tab=workshop] .drawer{flex-direction:column}
  .hdr .round .fpx{display:none}
  .dec .sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lname{font-size:12px;word-break:break-word}
  .main-pad{padding:10px 12px 24px;display:flex;flex-direction:column;gap:10px}
  .opps{grid-auto-flow:row;grid-auto-columns:auto}
  .kstage{padding:8px;border-radius:12px}
  .kst-body.work,.kst-body.firing{grid-template-columns:1fr}
  .zrow{grid-template-columns:44px repeat(3,minmax(0,1fr));gap:4px}
  .zl b{font-size:13px}
  .vault{padding:22px 6px 8px}
  .sp{min-height:72px;padding:4px}
  .cer .attr{display:none}
  .lad{--lw:62px}
  .lname{font-size:12px;min-height:46px;padding-right:2px}
  .lname small{display:none}
  .chip{padding:1px;border-radius:50%;flex-direction:column;gap:0;border-radius:10px;padding:1px 2px}
  .chip .ct{font-size:12px;line-height:1}
  .chip .qb{display:none}
  .band{min-height:46px}
  .drawer{border-radius:12px;border:1px solid var(--line);border-top:3px solid var(--pc);box-shadow:none;padding:10px}
  .drawer .dgrid{display:flex !important;flex-direction:column}
  .drawer .dhead .collapsed-only,.drawer .dtoggle{display:none !important}
  .mkt{overflow:visible}
  .rail{overflow:visible}
  .dfoot .btn{flex:1}
  .dopts{display:none}
  .kstage .dcard{display:flex}
  .kst-body.firing{display:flex;flex-direction:column}
  .kst-body.firing .fstage{order:-1}
  .hand{grid-template-columns:repeat(2,minmax(0,1fr))}
  .eq{gap:4px}.eqb{min-width:56px;padding:3px 6px}
}

en":"Firing step 1 Choose Contributions","note":"控火者暗选压火／守火／添柴，有柴簿者可加柴。","zh":"一、暗选控火"},{"en":"step 2 Reveal and pay","note":"同时亮牌，然后支付全部柴。","zh":"二、亮牌付柴"},{"en":"step 3 Determine Base Heat","note":"窑骰点数 + 控火修正，限定0–5。","zh":"三、定基础火候"},{"en":"step 4 Test Pieces","note":"按起始玩家顺序。","zh":"四、火照"},{"en":"step 5 Heat markers","note":"按起始玩家顺序；窑工标于此放置。","zh":"五、翻火标"},{"en":"step 6 Reveal Fire","note":"翻窑火牌，得全窑火候。","zh":"六、翻窑火"},{"en":"step 7 Calculate Actual Heat","note":"共窑：全窑火候 + 温区修正（或窑具修正）+ 火标。御窑：窑骰点数 + 窑火修正 + 御窑修正 + 火标。","zh":"七、算实际火候"},{"en":"step 8 Heat-adjustment abilities","note":"钧窑等。","zh":"八、调火"},{"en":"step 9 Assign Quality","note":"—","zh":"九、定品"},{"en":"step 10 After-Quality abilities","note":"匣钵护烧、复烧、哥窑开片等，按起始玩家顺序，各人自定己方顺序。","zh":"十、定品后结算"},{"en":"step 11 Salvage a Flawed ceramic","note":"可选。","zh":"十一、折卖瑕品"},{"en":"step 12 Finish firing","note":"成器移入成器区；清空共窑与御窑；收回火标、窑工标、支烧窑具；窑火牌正面弃置；收回控火牌。与游戏名呼应。","zh":"十二、开窑取器"},{"en":"skip the Firing Phase","note":"共窑与所有御窑皆空时，不翻窑火牌。","zh":"本轮不烧窑"}],"glazes":{"celadon":{"en":"Celadon","preferredHeat":2,"zh":"青釉"},"grey_green":{"en":"Grey-Green","preferredHeat":3,"zh":"灰青釉"},"moon_white":{"en":"Moon White","preferredHeat":4,"zh":"月白釉"},"white":{"en":"White","preferredHeat":1,"zh":"白釉"}},"imperialModifiers":[-1,0,1],"kilnDieFaces":[1,1,2,2,3,3],"kilns":{"DI":{"ability":{"en":"Once per round, when resolving a Form & Decorate action, after you form a Bowl, Plate or Brush Washer, you may pay 1 Clay and 1 Coin to form and decorate one additional vessel of the same Shape. Its Decoration, whichever you choose, costs that 1 Coin. This additional vessel does not count against the action's vessel limit and is not one of the 2 vessels for the Shifu's Decoration discount. For effects that refer to vessels formed by that action, it counts as formed by that action.","zh":"每轮一次，在结算制坯饰纹行动时，你制成1件碗、盘或笔洗后，可支付1泥和1铜钱，再制1件同器型的坯，并任选1种纹饰；该纹饰费用即为这1铜钱。学徒或师傅行动皆可。此额外坯不计入该行动的件数上限，也不是师傅纹饰减免所指的“2件”之一；对提及“该行动所制坯”的效果，视为该行动所制。师傅减免与饰坯匣都不适用于此件；它也不是瓶或香炉。练泥所制坯不触发定窑。"},"abilityName":{"en":"Moulded Production","zh":"范制成器"},"en":"Ding Kiln","shortText":{"en":"Once per round, in a Form & Decorate action:\nafter forming a Bowl/Plate/Brush Washer, you may pay 1 Clay + 1 Coin for 1 more of that Shape","zh":"每轮一次，制坯饰纹行动中：\n制碗／盘／笔洗后，可付1泥1铜钱再制1件同型坯"},"zh":"定窑"},"GE":{"ability":{"en":"Once per round, after Quality is assigned, choose 1 of your ceramics from this firing that is Standard: it develops Crackle and becomes Fine. Place a Crackle marker on it; the ceramic keeps the marker. When completing an Order, each of your Crackle ceramics may count as having any one Decoration for that Order's Decoration requirements. Its printed Decoration is unchanged. A Crackle ceramic is never a Masterpiece, so it cannot fill a Masterpiece requirement.","zh":"每轮一次，定品后，你可以选择你本次烧成中1件当时为良品的器物：其开片，品质变为上品。在其上放置开片标；开片标保留至该器物交付或陈列。不使用时不消耗本轮次数。完成委托时，你的每件开片器可视为具有任意一种纹饰，以满足该委托的纹饰要求（每件各自声明）；其原纹饰不变，陈列与汝窑仍按原纹饰。开片器永不是臻品，不能满足臻品要求。可在匣钵护烧之后作用于同一器物（瑕品→良品→上品）。与其他“定品后”能力的顺序由你自定，不必最后结算。"},"abilityName":{"en":"Crackle Mastery","zh":"金丝铁线"},"en":"Ge Kiln","shortText":{"en":"Once per round, after Quality: you may crackle 1 of your Standard ceramics from this firing to Fine\nCompleting Orders, Crackle counts as any one Decoration; never a Masterpiece","zh":"每轮一次，定品后：可令己方本窑1件良品开片升上品\n完成委托时，开片器可作任一纹饰；永非臻品"},"zh":"哥窑"},"GU":{"ability":{"en":"Once per round, when you complete an Order showing at least 1 Crown, gain 2 Coins and 1 VP.","zh":"每轮一次，当你完成一张印有至少1个御令的委托时，获得2铜钱和1分。经漕船完成亦可触发；贡瓷额外获得的御令不算“印有”。"},"abilityName":{"en":"Imperial Patronage","zh":"内府恩眷"},"en":"Guan Kiln","shortText":{"en":"Once per round, completing an Order with 👑: gain 2 Coins and 1 VP","zh":"每轮一次，完成带👑委托时：得2铜钱1分"},"zh":"官窑"},"JU":{"ability":{"en":"Once per round, after Actual Heat is calculated but before Quality is assigned, you may pay 1 Wood to adjust the Actual Heat of one of your ceramics by +1 or −1.","zh":"每轮一次，实际火候算出后、定品前，你可以支付1柴，将你1件器物的实际火候调整+1或−1（火标已计入）。（若本轮尚未使用，也可在复烧重算实际火候后、定新品质前用于该器物；已用过则不可再用。）"},"abilityName":{"en":"Kiln Transformation","zh":"窑变天成"},"en":"Jun Kiln","shortText":{"en":"Once per round, before Quality: you may pay 1 Wood to adjust 1 of your ceramics' Actual Heat ±1","zh":"每轮一次，定品前：可付1柴，己方1件器物火候±1"},"zh":"钧窑"},"RU":{"ability":{"en":"Once per round, when you complete an Order using a Masterpiece with Celadon Glaze and Plain Decoration, gain 4 VP. The Order itself does not need to require Masterpiece, Celadon or Plain; the delivered ceramic must actually have those attributes.","zh":"每轮一次，当你完成委托时，若所交付器物中有1件为臻品、青釉、素面，获得4分。委托本身不必要求臻品、青釉或素面；只看实际交付器物的属性（开片器按原纹饰计）。经漕船完成亦可触发。"},"abilityName":{"en":"Quiet Perfection","zh":"天青无瑕"},"en":"Ru Kiln","shortText":{"en":"Once per round: complete an Order with a Celadon, Plain Masterpiece for +4 VP","zh":"每轮一次：以臻品青釉素面器完成委托，+4分"},"zh":"汝窑"}},"locations":{"canal_wharf":{"apprenticeText":{"en":"Gain 2 Coins.","zh":"获得2铜钱。"},"capacity":{"2":null,"3":null,"4":null},"en":"Canal Wharf","personalSpaces":null,"scope":"central","shifuText":{"en":"Gain 4 Coins.","zh":"获得4铜钱。"},"usableAtRecognition":null,"zh":"漕运码头"},"commission_market":{"apprenticeText":{"en":"Reserve 1 Main Order. Then gain 1 Clay, 1 Wood or 1 Coin.","zh":"承接1张主委托，然后获得1泥、1柴或1铜钱。"},"capacity":{"2":2,"3":3,"4":4},"en":"Commission Market","personalSpaces":null,"scope":"central","shifuText":{"en":"Reserve up to 2 Main Orders, resolving each reservation separately. For 1 of them you may instead look at the top 3 Main Orders, reserve 1 of them and discard the rest. After each Order you reserve, gain 1 Clay, 1 Wood or 1 Coin.","zh":"承接1或2张主委托，逐次结算。其中1次可改为：私下查看主委托牌堆顶3张，承接1张，其余弃置。每承接1张后，获得1泥、1柴或1铜钱。"},"usableAtRecognition":null,"zh":"瓷牙行"},"form_decorate":{"apprenticeText":{"en":"Form 1 vessel: pay its Clay cost, choose a Decoration and pay the Decoration cost.","zh":"制1件坯：支付其泥费用，选择1种纹饰并支付纹饰费用（2铜钱）。"},"capacity":null,"en":"Form & Decorate","personalSpaces":{"total":2,"unlockedAtStart":1},"scope":"personal","shifuText":{"en":"Form up to 2 vessels, choosing and payi  the deck. You may not show it.","zh":"每轮一次，基础火候定后、翻火标前，若你有至少1件器物在本次烧成中（含御窑），可支付1柴，私下查看窑火牌堆顶1张。然后你可以将其置于牌堆底。不得展示该牌，但可以谈论所见。（按起始玩家顺序结算；付柴与置底为公开信息，所见点数仅你可见。）"},"cost":3,"discipline":"firing","en":"Test Pieces","oncePerRound":true,"shortText":{"en":"Once per round, after Base Heat: you may pay 1 Wood to peek at the top Fire card\nYou may then put it on the bottom","zh":"每轮一次，基础火候定后：可付1柴私看顶牌\n看后可将其置于牌堆底"},"timing":"after_base_heat","unlocks":null,"zh":"火照"},"T14":{"ability":{"en":"Once per round, after Quality is assigned, choose 1 of your Flawed or Standard ceramics from this firing. Reveal 1 extra Fire card and recalculate that ceramic's Actual Heat and Quality with the same Base Heat, zone modifier, Kiln Furniture modifier and Heat marker and the new Fire modifier. Jun's adjustment from the first calculation does not carry over. The new Quality replaces the old, even if worse. Discard the extra Fire card after resolving it.","zh":"每轮一次，定品后，你可以选择你本次烧成中的1件瑕品或良品，额外翻1张窑火牌，以相同的基础火候、温区修正、窑具修正与火标配合新的窑火修正，重新计算该器物的实际火候与品质。首次计算时的钧窑调整不保留。新品质取代旧品质，即使更差。结算后弃置这张额外窑火牌；它不影响其他器物。（若本轮尚未使用钧窑，可在重算实际火候后、定新品质前使用。）"},"cost":2,"discipline":"firing","en":"Second Firing","oncePerRound":true,"shortText":{"en":"Once per round, after Quality: you may refire 1 of your Flawed/Standard ceramics from this firing\nReveal 1 extra Fire card; the new Quality stands even if worse","zh":"每轮一次，定品后：可令己方本窑1件瑕品／良品复烧\n另翻1张窑火牌重算，结果更差也须接受"},"timing":"after_quality","unlocks":null,"zh":"复烧"},"T15":{"ability":{"en":"Once per round, when you load 1 ceramic into the Shared Kiln, you may place this tile beneath it and choose its zone modifier for this firing: −1, 0 or +1. Return the tile after firing.","zh":"每轮一次，当你将1件器物装入共窑时，可将本牌垫于其下，并为本次烧成选定该器物的温区修正：−1、0或+1。烧成后收回本牌。只用于共窑。"},"cost":2,"discipline":"glazing_loading","en":"Kiln Furniture","oncePerRound":true,"shortText":{"en":"Once per round, loading into the Shared Kiln: you may place this beneath 1 ceramic\nIts zone modifier is your choice of −1/0/+1","zh":"每轮一次，装共窑时：可垫于1件之下\n该件温区修正自选−1／0／+1"},"timing":"loading_shared_kiln","unlocks":"glaze_load","zh":"支烧窑具"},"T16":{"ability":{"en":"Once per round, 1 Carved, Impressed or Painted Decoration you apply costs 1 Coin less. It may be the same Decoration the Shifu's discount reduces.","zh":"每轮一次，你施加的1项刻花、印花或画花纹饰少付1铜钱。可与师傅的纹饰减免作用于同一纹饰（刻花即为0铜钱）。可用于经练泥所付的纹饰；不适用于素面，也不适用于定窑的1铜钱额外坯。"},"cost":2,"discipline":"workshop","en":"Decorator's Kit","oncePerRound":true,"shortText":{"en":"Once per round: 1 Carved/Impressed/Painted Decoration costs 1 Coin less","zh":"每轮一次：1项刻花／印花／画花少付1铜钱"},"timing":"form_decorate_action","unlocks":"form_decorate","zh":"饰坯匣"},"T17":{"ability":{"en":"Once per round, during a Materials Yard action, after gaining resources, you may form 1 vessel: pay its Clay cost +1 and a Decoration cost. This is a Tech effect, not a Form & Decorate action.","zh":"每轮一次，在一次泥柴场行动中获得资源后，你可以制1件坯：支付其泥费用+1，并选择1种纹饰支付纹饰费用。这是技艺效果，不算制坯饰纹行动。"},"cost":3,"discipline":"workshop","en":"Prepared Clay","oncePerRound":true,"shortText":{"en":"Once per round, Materials Yard action after gaining: you may form 1 vessel\nClay cost +1, pay its Decoration","zh":"每轮一次，泥柴场行动得料后：可制1件坯\n泥费+1，纹饰照付"},"timing":"materials_yard_action","unlocks":"form_decorate","zh":"练泥"},"T18":{"ability":{"en":"Once per round, 1 Apprentice you place at the Materials Yard or Commission Market resolves the Shifu effect there instead of the Apprentice effect.","zh":"每轮一次，你派往泥柴场或瓷牙行的1名学徒，可改为结算该地点的完整师傅效果：在泥柴场含“付1铜钱得1泥1柴”；在瓷牙行含至多2次承接、其中1次可看三取一、每次承接后得1份资源。不适用于州衙。不使用时，该学徒照常结算学徒效果，本轮仍可留待另一名学徒使用。"},"cost":2,"discipline":"workshop","en":"Senior Apprentice","oncePerRound":true,"shortText":{"en":"Once per round: 1 Apprentice at the Materials Yard or Commission Market may resolve the Shifu effect","zh":"每轮一次：泥柴场或瓷牙行可令1名学徒按师傅结算"},"timing":"worker_placement","unlocks":"form_decorate","zh":"高徒"},"T19":{"ability":{"en":"At game end, each Fine or Masterpiece ceramic in your Exhibition scores +1 VP, up to +5 VP.","zh":"终局时，你的终局陈列中每件上品或臻品额外+1分，至多+5分。"},"cost":3,"discipline":"workshop","en":"Connoisseur's Cabinet","oncePerRound":false,"shortText":{"en":"Game end: +1 VP per Fine or Masterpiece in your Exhibition, max +5","zh":"终局：陈列中每件上品或臻品+1分，至多+5"},"timing":"game_end","unlocks":"form_decorate","zh":"清玩斋"},"T20":{"ability":{"en":"Once per round, after a Glaze & Load action in which you loaded at least 1 ceramic, gain 1 Clay and 1 Wood.","zh":"每轮一次，在一次至少装窑1件的施釉装窑行动之后，获得1泥和1柴。（数字版于每轮首次符合条件时自动结算。经御烧优先或其他技艺效果装窑不触发。）"},"cost":2,"discipline":"glazing_loading","en":"Kiln Tending","oncePerRound":true,"shortText":{"en":"Once per round, after a Glaze & Load action that loads: gain 1 Clay and 1 Wood","zh":"每轮一次，施釉装窑行动装窑后：得1泥1柴"},"timing":"glaze_load_action_after","unlocks":"glaze_load","zh":"看火"},"T21":{"ability":{"en":"Once per round, when you load a Bowl, Plate or Brush Washer into the Shared Kiln, you may place it in an active space that already holds exactly 1 of your ceramics. Both use that space's modifier (or its Kiln Furniture modifier).","zh":"每轮一次，当你将1件碗、盘或笔洗装入共窑时，可将其放入一个恰有1件你的器物的启用窑位，包括本次行动先装入的那件。两件器物都使用该窑位的温区修正（若该窑位有支烧窑具，则用窑具修正）。只用于共窑。"},"cost":2,"discipline":"glazing_loading","en":"Inverted Firing","oncePerRound":true,"shortText":{"en":"Once per round: a Bowl/Plate/Brush Washer may stack in a space holding exactly 1 of your ceramics","zh":"每轮一次：碗／盘／笔洗可叠入己方仅1件的窑位"},"timing":"loading_shared_kiln","unlocks":"glaze_load","zh":"覆烧"},"T22":{"ability":{"en":"Once per round, at the start of the Work Phase (in First Player order), place this tile on an empty active Shared Kiln space. Only you may load there this round. Return it when you load there, or at Cleanup.","zh":"每轮一次，派工阶段开始时（按起始玩家顺序），你可以将本牌放在共窑一个空的启用窑位上。本轮只有你能在此装窑。你在此装窑时，或收工时，收回本牌。（本轮中途习得者，从下一次派工阶段开始时起放置。只用于共窑。）"},"cost":2,"discipline":"glazing_loading","en":"Setter's Mark","oncePerRound":true,"shortText":{"en":"Once per round, at the start of the Work Phase: you may mark 1 empty kiln space; only you may load there","zh":"每轮一次，派工阶段开始时：可占1空窑位，仅你可装"},"timing":"work_phas function ruleText(code, d = {}) {

  if (rep.discipline) rep.discipline = tr(LB.disciplines[rep.discipline]);

}

function phaseKey() { const t = G.phase.type; return t === 'work_turn' ? 'work' : t.startsWith('firing') ? 'firing' : t === 'orders' ? 'orders' : t.startsWith('cleanup') ? 'cleanup' : 'start'; }

/* ---------------- locations ---------------- */
function placementFor(loc) { return SEL.placementOptions?.find(p => p.locationId === loc); }
function quoteKey(loc, kind) {
  const Q = SEL.quotes || {}; const pre = { materials_yard: 'materialsYard', form_decorate: 'formDecorate' }[loc]; if (!pre) return null;
  return Object.keys(Q).find(x => x.startsWith(pre + (kind === 'shifu' ? 'Shifu' : 'Apprentice'))) || null;
}
function quoteLabel(k) {
  const tail = k.split('_').slice(1).join('_');
  if (k.startsWith('formDecorate')) return tail.split('_plus_').map(x => { const [sh, de] = x.split('_'); return tr(LB.shapes[sh]) + ' · ' + tr(LB.decorations[de]); }).join(' + ');
  if (k.includes('withBonus')) return S.lang === 'zh' ? '含加购' : 'with bonus';
  return '';
}
function reasonFor(loc, w) {
  if (!w || w.legal) return '';
  if (w.reason === 'INSUFFICIENT_RESOURCES' && loc === 'magistrates_hall') return ruleText('INSUFFICIENT_RESOURCES', SEL.magistratesHallQuote[w.effect].error.details);
  const k = quoteKey(loc, w.kind); const q = k && SEL.quotes[k];
  if (w.reason === 'NO_MAIN_ACTION_POSSIBLE' && q && q.error) return ruleText(q.error.code, q.error.details);
  if (w.reason === 'NO_MAIN_ACTION_POSSIBLE') return ruleText('NO_MAIN_ACTION_POSSIBLE', { locationId: loc });
  return ruleText(w.reason, {});
}
function quoteHint(loc, kind) {
  const k = quoteKey(loc, kind); if (!k) return '';
  const q = SEL.quotes[k]; const g = costText(q.gain), p = costText(q.pay);
  const lab = quoteLabel(k);
  const body = [g && `${U('gain')} ${g}`, p && `${U('pay')} ${p}`].filter(Boolean).join(' · ');
  const tail = q.ok || loc === 'form_decorate' ? '' : ` — ${ruleText(q.error.code, q.error.details)}`;
  return `<div class="${q.ok ? 'quote' : 'quote faint'}">${q.ok ? '✓' : '·'} ${esc(U('ex'))} ${esc(lab ? lab + ': ' : '')}${esc(body)}${esc(tail)}</div>`;
}

  return { cls: w && w.legal ? 'legal' : 'illegal', html };

function locTile(loc) {

    const sp = ks.filter(s => s.zone === z).sort((a, b) => a.spaceId.localeCompare(b.spaceId));

      const n = s.spaceId.split('_')[1];
      if (!s.active) return `<div class="sp cov"><span class="spid">${n}</span>${esc(U('covered', { n: lay.playerCount }))}</div>`;
      if (!s.ceramics.length) return `<div class="sp empty"><span class="spid">${n}</span>${esc(U('empty'))}${s.setterMarkOwnerId ? ` · <span class="pdot" style="${pc(s.setterMarkOwnerId)}"></span>${esc(tr(LB.techs.T22))}` : ''}</div>`;
      const mine = s.ceramics.some(c => c.ownerId === VIEW);

}
function imperialKilns() {

  return `<div class="imps">${owners.map(p => {

const FIRE_FULL = () => LB.fireDeck.slice();

function ladder() {
  const hl = SEL.heatLadder; const HMAX = 7; const cols = HMAX + 1;

  const head = `<span></span>${Array.from({ length: cols }, (_, h) => `<span class="hc ${!after && h === hl.baseHeat ? 'bh' : ''}">${h}</span>`).join('')}<span class="hc">${pend.length ? esc(U('pendingCol')) : ''}</span>`;
  const qd = d => d === 0 ? 'd0' : d === 1 ? 'd1' : d === 2 ? 'd2' : 'd3';
  const rows = hl.preferredHeatBands.map(b => {
    const chips = hl.chips.filter(c => c.glaze === b.glaze);
    const bands = Array.from({ length: cols }, (_, h) => `<span class="band ${qd(Math.min(3, Math.abs(h - b.preferredHeat)))} ${h === b.preferredHeat ? 'pref' : ''}" style="grid-column:${h + 1}"></span>`).join('');

}

  const open = S.drawer ? S.drawer === 'open' : (G.phase.type === 'work_turn' && M.viewerActs);
  const sp = me.personalSpaces;
  const pl = loc => `<div class="pl"><h5 title="${esc(tr(LB.workers.apprentice) + ': ' + tr(LB.locations[loc].apprenticeText) + '\n' + tr(LB.workers.shifu) + ': ' + tr(LB.locations[loc].shifuText))}">${esc(tr(LB.locations[loc]))} <span class="small muted" style="font-family:var(--sans);font-weight:400">ⓘ</span></h5>${sp.filter(s => s.locationId === loc).map(s => personalSpace(loc, s.spaceIndex, s)).join('')}</div>`;
  const tslots = ['workshop', 'glazing_loading', 'firing'].map(d => { const t = me.techs.find(x => x.discipline === d); const T = t && LB.techs[t.techId];
    return `<div class="tslot ${DISC[d]} ${t ? 'has' : ''}"><b style="color:var(--dc)">${esc(tr(LB.disciplines[d]))}</b> ${t ? `· ${esc(tr(T))} <span class="tag ${t.ready ? 'teal' : ''}">${esc(t.ready ? U('ready') : U('used'))}</span>` : `<span class="muted">· ${esc(U('emptySlot'))}</span>`}</div>`; }).join('');
  const listC = ids => ids.length ? `<div class="cers">${ids.map(id => cerCard(id, 40)).join('')}</div>` : `<span class="small muted">${esc(U('none'))}</span>`;
  const imp = me.imperial.kilnGained ? `<div class="imp" style="margin-top:4px"><div><h5>${esc(U('imperialKiln'))}</h5><div class="small muted">${me.imperial.kilnCeramic ? esc(U('imperialMod')) + ' ' + sg(me.imperial.kilnCeramic.placement.imperialModifier) : esc(U('empty'))}</div></div>${me.imperial.kilnCeramic ? cerCard(me.imperial.kilnCeramic.id, 30) : ''}</div>`
    : `<div class="small muted" style="margin-top:4px">${esc(U('imperialKiln'))}: ${esc(U('noImperial'))}</div>`;
  const hl = SEL.handLimitStatus[VIEW];
  const hm = me.heatMarkerCeramicId ? U('markerHere', { c: me.heatMarkerCeramicId }) : U('markerSupply');
  const workers = Object.keys(G.players[VIEW].workers).map(w => `<span class="meeple ${w.endsWith('shifu') ? 'shifu' : ''} ${me.availableWorkerIds.includes(w) ? '' : 'off'}" style="${pc(VIEW)}" title="${esc(tr(LB.workers[w.endsWith('shifu') ? 'shifu' : 'apprentice']))}">${w.endsWith('shifu') ? '師' : ''}</span>`).join('');
  return `<section class="drawer ${open ? '' : 'closed'}" style="${pc(VIEW)}" data-pt="workshop">
    <div class="dhead" data-pt="workshop"><span class="nm"><span class="pdot" style="${pc(VIEW)}"></span>${esc(U('myBoard'))} · ${pname(VIEW)}</span>
      <span class="tag">${esc(kilnName(me.kilnId))} · ${esc(tr(K.abilityName))}</span><span class="tag gold">${me.recordedVp} ${esc(U('vp'))} ${esc(U('recorded'))}</span><span class="tag">${esc(U('rec'))} ${me.recognition}/4</span>
      <span class="collapsed-only" style="gap:10px;align-items:center">${resHtml(me.resources)}<span>${workers}</span><span class="tag priv">${esc(U('hand'))} ${own.orderHand.length} · ${esc(U('privateOnly'))}</span><span class="small muted">${esc(hm)}</span></span>
      <button class="btn dtoggle" data-drawer style="margin-left:auto">${esc(open ? U('close') : U('open'))}</button></div>
    <div class="dgrid">
      <div class="box" data-pt="workshop" style="flex-direction:column"><h4>${esc(U('tradition'))}</h4><b>${esc(kilnName(me.kilnId))} · ${esc(tr(K.abilityName))}</b> <span class="tag ${me.kilnAbilityReady ? 'teal' : ''}">${esc(me.kilnAbilityReady ? U('ready') : U('used'))}</span><p class="trad">${esc(tr(K.shortText))}</p>
        <h4 style="margin-top:6px">${esc(U('resources'))}</h4>${resHtml(me.resources)}<div style="display:flex;gap:4px;margin-top:4px;align-items:center">${workers}<span class="small muted" style="margin-left:4px">${esc(me.availableWorkerIds.length ? U('workersLeft', { n: me.availableWorkerIds.length }) : U('allPlaced'))}</span></div><div class="small muted" style="margin-top:3px">${esc(hm)}</div></div>
      <div class="box pspaces" data-pt="workshop" style="flex-direction:column"><h4>${esc(U('personal'))}</h4>${pl('form_decorate')}${pl('glaze_load')}</div>
      <div class="box" data-pt="workshop" style="flex-direction:column"><h4>${esc(U('workshop'))} · ${esc(U('shaped'))}</h4>${listC(me.shapedCeramicIds)}<h4 style="margin-top:6px">${esc(U('finished'))}</h4>${listC(me.finishedCeramicIds)}${imp}</div>
      <div class="box" data-pt="workshop" style="flex-direction:column"><h4>${esc(U('techSlots'))}</h4><div class="tslots">${tslots}</div></div>
    </div></section>`;
}

/* ---------------- assemble ---------------- */
function render() {
  load();
  if (!S.tab) S.tab = isFiring() ? 'kiln' : (G.phase.type === 'work_turn' && M.viewerActs ? 'table' : 'kiln');
  document.documentElement.lang = S.lang === 'zh' ? 'zh-Hans' : 'en';
  const app = document.getElementById('app');
  app.className = 'app' + (isFiring() ? ' firing' : '');
  app.dataset.tab = S.tab;
  app.innerHTML = `<div class="sticky">${header()}${decision()}${tabs()}${ribbon()}</div>`;
  // desktop grid needs hdr/dec as direct children: unwrap on wide screens
  if (matchMedia('(min-width:760px)').matches) app.innerHTML = header() + decision() + ribbon();
  app.insertAdjacentHTML('beforeend', `<div class="main-pad" id="mp">${kilnStage()}${opponents()}
    <div class="rail l" data-pt="table">${['materials_yard', 'commission_market', 'guild_hall'].map(locTile).join('')}</div>
    <div class="rail r" data-pt="table">${['canal_wharf', 'magistrates_hall'].map(locTile).join('')}${recognition()}</div>
    ${market()}${drawer()}</div>`);
  if (matchMedia('(min-width:760px)').matches) { const mp = document.getElementById('mp'); while (mp.firstChild) app.insertBefore(mp.firstChild, mp); mp.remove(); }
  bind();
}
function bind() {
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { S.lang = b.dataset.lang; render(); });
  const ms = document.getElementById('msel'); if (ms) ms.onchange = () => { S.m = ms.value; S.tab = null; S.drawer = null; S.worker = null; render(); };
  document.querySelectorAll('[data-worker]').forEach(b => b.onclick = () => { S.worker = b.dataset.worker; render(); });
  document.querySelectorAll('[data-tab]').forEach(b => { if (b.tagName === 'BUTTON') b.onclick = () => { S.tab = b.dataset.tab; render(); scrollTo(0, 0); }; });
  document.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => { S.tab = b.dataset.goto; render(); scrollTo(0, 0); });
  document.querySelectorAll('[data-drawer]').forEach(b => b.onclick = () => { const d = b.closest('.drawer'); S.drawer = d.classList.contains('closed') ? 'open' : 'closed'; render(); });
}
let lastWide = matchMedia('(min-width:760px)').matches;
addEventListener('resize', () => { const w = matchMedia('(min-width:760px)').matches; if (w !== lastWide) { lastWide = w; render(); } });
render();
</script>
</body>
</html>
