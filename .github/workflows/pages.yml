name: Build and deploy luyuan.me

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rebuild_game:
        description: Rebuild and test Kiln Opening (use after changing the Supabase variables)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v5

      # Every deploy replaces the whole site, so the game's build output is always needed.
      # It is cached under a hash of apps/kiln-opening/ and this workflow: when neither has
      # changed, the last build is reused and the install, test and build steps are skipped.
      # The key is computed here, before npm ci adds node_modules to the folder.
      - name: Compute game build key
        id: game-key
        run: echo "key=kiln-opening-dist-${{ hashFiles('apps/kiln-opening/**', '.github/workflows/pages.yml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore game build
        id: game-cache
        if: ${{ !inputs.rebuild_game }}
        uses: actions/cache/restore@v6
        with:
          path: apps/kiln-opening/dist
          key: ${{ steps.game-key.outputs.key }}

      - name: Set up Node.js
        if: steps.game-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/kiln-opening/package-lock.json

      - name: Install game dependencies
        if: steps.game-cache.outputs.cache-hit != 'true'
        working-directory: apps/kiln-opening
        run: npm ci

      - name: Verify rules, backend, and client
        if: steps.game-cache.outputs.cache-hit != 'true'
        working-directory: apps/kiln-opening
        run: |
          npm run typecheck
          npm run typecheck:edge
          npm test

      - name: Build game client
        if: steps.game-cache.outputs.cache-hit != 'true'
        working-directory: apps/kiln-opening
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Save game build
        if: steps.game-cache.outputs.cache-hit != 'true'
        # A failed cache save (for example the key already exists) must not block the deploy.
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: apps/kiln-opening/dist
          key: ${{ steps.game-key.outputs.key }}

      - name: Note how the game was built
        env:
          CACHE_HIT: ${{ steps.game-cache.outputs.cache-hit }}
          KEY: ${{ steps.game-key.outputs.key }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            echo "Kiln Opening unchanged: reused the cached build ($KEY)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Kiln Opening built and tested ($KEY)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage homepage and apps
        run: |
          mkdir -p _site/kiln-opening _site/ark-nova-placement
          rsync -a ./ _site/ \
            --exclude .git \
            --exclude .github \
            --exclude _site \
            --exclude apps \
            --exclude node_modules
          cp -R apps/kiln-opening/dist/. _site/kiln-opening/
          # Static page, no build step
          cp -R apps/ark-nova-placement/. _site/ark-nova-placement/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
